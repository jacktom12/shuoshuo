<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>碎碎念</title>
  <link rel="stylesheet" href="https://cdn.staticfile.org/lxgw-wenkai-screen-webfont/1.7.0/style.min.css">
  <link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">🌿</text></svg>'>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-container">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="topbar-left" style="display: flex; align-items: center; gap: 12px;">
          <span class="blog-brand" style="font-weight: 700; font-size: 1.15rem; letter-spacing: 1px;">迷蒙幻影</span>
          <button id="themeBtn" class="topbar-icon" aria-label="切换深浅色">🌙</button>
        </div>
        <div class="topbar-right">
          <div class="search-inline" id="searchInline">
            <input id="search" type="text" placeholder="搜索记忆..." />
            <button id="searchToggleBtn" class="topbar-icon" aria-label="搜索">🔍</button>
          </div>
          <button id="openPublishBtn" class="publish-pill" aria-label="发布说说">✎</button>
        </div>
      </div>
    </header>

    <!-- main 成为独立滚动容器 -->
    <main id="mainScroll">
      <section id="posts"></section>
      <div id="loader">正在翻阅更久远的记忆...</div>
    </main>
  </div>

  <div id="lightbox" class="lightbox">
    <button id="lb-close" class="lb-btn">✕</button>
    <button id="lb-prev" class="lb-btn nav-btn">❮</button>
    <img id="lb-img" src="" alt="preview" />
    <button id="lb-next" class="lb-btn nav-btn">❯</button>
    <div id="lb-counter">1 / 1</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
