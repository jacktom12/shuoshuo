<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>碎碎念</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-container">
    <header class="topbar">
      <div class="topbar-inner">
        <button id="themeBtn" class="topbar-icon" aria-label="切换深浅色">☾</button>

        <div class="topbar-right">
          <div class="search-inline" id="searchInline">
            <input id="search" type="text" placeholder="搜索记忆..." />
            <button id="searchToggleBtn" class="topbar-icon" aria-label="搜索">⌕</button>
          </div>

          <button id="openPublishBtn" class="publish-pill" aria-label="发布说说">发布</button>
        </div>
      </div>
    </header>

    <main>
      <section id="posts"></section>
      <div id="loader">正在翻阅更久远的记忆...</div>
    </main>
  </div>

  <div id="lightbox" class="lightbox">
    <button id="lb-close" class="lb-btn">✕</button>
    <button id="lb-prev" class="lb-btn nav-btn">❮</button>
    <img id="lb-img" src="" alt="preview" />
    <button id="lb-next" class="lb-btn nav-btn">❯</button>
    <div id="lb-counter">1 / 1</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
