<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>碎碎念</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪶</text></svg>">
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <div class="app-container">
    <header class="header">
      <div class="header-top">
        <button id="searchToggleBtn" class="icon-btn">⌕</button>
        <h1>碎碎念</h1>
         <div class="header-actions">
  <button id="openPublishBtn" class="publish-fab" aria-label="发布说说">+</button>
  <button id="themeBtn" class="icon-btn">☾</button>
</div>
      </div>

      <div id="searchWrap" class="search-wrap">
        <input id="search" placeholder="搜索记忆..." />
      </div>
    </header>

    <main>
      <div class="profile-header profile-card">
  <div class="profile-avatar profile-avatar-center">
    <img src="https://raw.githubusercontent.com/jacktom12/blogpic3/main/Muhteşem Whatsapp Profil Fotoğrafları [Full HD].jpg" alt="avatar" />
    <p class="profile-status">after midnight</p>

  </div>

  <h2 class="profile-title">碎碎念</h2>
  <p class="profile-subtitle">night archive / private memos</p>

  <p class="profile-bio">
    生死去来，棚头傀儡。<br>
    一线断时，落落磊磊。
  </p>

  <div class="profile-tags">
    <span>记录</span>
    <span>幻影</span>
    <span>夜间出没</span>
  </div>
</div>

      <div id="posts"></div>
      <div id="loader">正在翻阅更久远的记忆...</div>
    </main>
  </div>

  <div id="lightbox" class="lightbox">
    <button id="lb-close" class="lb-btn">✕</button>
    <button id="lb-prev" class="lb-btn nav-btn">❮</button>
    <img id="lightboxImg" alt="preview" />
    <button id="lb-next" class="lb-btn nav-btn">❯</button>
    <div id="lb-counter">1 / 1</div>
  </div>

  <script src="app.js"></script>
</body>
</html>
