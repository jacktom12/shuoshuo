<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>手账</title>
    <link
      rel="stylesheet"
      href="https://cdn.staticfile.org/lxgw-wenkai-screen-webfont/1.7.0/style.min.css"
    />
    <link
      rel="icon"
      href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect x="15" y="20" width="70" height="60" rx="6" fill="%23fff9e6" stroke="%23323232" stroke-width="3"/><line x1="25" y1="35" x2="75" y2="35" stroke="%23323232" stroke-width="2"/><line x1="25" y1="45" x2="70" y2="45" stroke="%23323232" stroke-width="2"/><line x1="25" y1="55" x2="65" y2="55" stroke="%23323232" stroke-width="2"/><line x1="25" y1="65" x2="75" y2="65" stroke="%23323232" stroke-width="2"/><path d="M80 15 L85 20 L75 30 L70 25 Z" fill="%23E5AA70" stroke="%23323232" stroke-width="2"/></svg>'
    />
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
      :root {
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-left: env(safe-area-inset-left, 0px);
        --safe-right: env(safe-area-inset-right, 0px);

        /* 完美同步登录页面的 P5 涂鸦风格配色体系 */
        --ink: #323232;
        --bg: #f3e9dd; /* 奶黄色底色 */
        --paper: #fff9e6; /* 手绘米白纸张感 */
        --text: #323232;
        --accent: #e5aa70; /* 标志性暖橙色 */
        --accent-dark: #d4924f;
        --border: #323232;
        --gold-glow: rgba(229, 170, 112, 0.4);
        --secondary-text: #666666;

        --img-brightness: 1;
        --dot-normal: #cccccc;
        --dot-active: #e5aa70;
        --lightbox-bg: rgba(243, 233, 221, 0.98);
        --lightbox-btn-bg: #fff9e6;
        --lightbox-btn-color: #323232;
        --lightbox-shadow: 3px 3px 0px #323232;

        /* P5 倾斜与不规则手绘风骨架 */
        --p-skew: rotate(-0.5deg) skewX(-1deg);
        --p-skew-anti: skewX(1deg) rotate(0.5deg);
        --p-shadow: 4px 4px 0px #323232;

        /* 手绘不规则圆角微调 */
        --sketch-radius-1: 8px 24px 8px 24px / 24px 8px 24px 8px;
        --sketch-radius-2: 24px 8px 24px 8px / 8px 24px 8px 24px;
        --sketch-radius-btn: 16px 5px 16px 5px / 5px 16px 5px 16px;
      }

      /* 暗黑模式适配 - 保持P5反色涂鸦质感 */
      body.dark {
        --bg: #1a1917;
        --paper: #2d2a26;
        --text: #f3e9dd;
        --ink: #f3e9dd;
        --accent: #daa06d;
        --accent-dark: #e5aa70;
        --border: #f3e9dd;
        --gold-glow: rgba(218, 160, 109, 0.25);
        --secondary-text: #a0988e;
        --img-brightness: 0.85;
        --dot-normal: #4a453f;
        --dot-active: #daa06d;
        --lightbox-bg: rgba(26, 25, 23, 0.99);
        --lightbox-btn-bg: #2d2a26;
        --lightbox-btn-color: #f3e9dd;
        --lightbox-shadow: 3px 3px 0px #f3e9dd;
        --p-shadow: 4px 4px 0px #f3e9dd;
      }

      body.dark .post:hover {
        box-shadow:
          0 0 18px rgba(218, 160, 109, 0.25),
          0 0 36px rgba(218, 160, 109, 0.12);
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
        height: 100dvh;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family:
          "Comic Sans MS", "Chalkboard SE", "LXGW WenKai Screen", sans-serif;
        display: flex;
        justify-content: center;
        overscroll-behavior: contain;
        -webkit-font-smoothing: antialiased;
      }

      .app-container {
        width: 100%;
        max-width: 660px;
        height: 100vh;
        height: 100dvh;
        overflow-y: auto;
        background: var(--bg);
        border-left: 3px solid var(--border);
        border-right: 3px solid var(--border);
        position: relative;
        scrollbar-width: thin;
        scrollbar-color: var(--border) var(--bg);
        padding-bottom: calc(40px + var(--safe-bottom));
      }

      /* 顶部导航条改造 */
      .topbar {
        position: sticky;
        top: 0;
        z-index: 20;
        background: var(--bg);
        border-bottom: 3px solid var(--border);
        padding-top: var(--safe-top);
      }
      .topbar-inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding: 16px 20px;
      }

      .blog-brand {
        color: var(--ink) !important;
        background: var(--accent);
        padding: 6px 16px;
        font-weight: 900;
        font-size: 1.35rem;
        letter-spacing: 1px;
        text-transform: uppercase;
        transform: rotate(-3deg) skewX(-4deg);
        display: inline-block;
        border: 2px solid var(--border);
        box-shadow: -4px 4px 0px var(--border);
        cursor: pointer;
        text-shadow: 1px 1px 0px rgba(0, 0, 0, 0.1);
      }
      .blog-brand:hover {
        animation: doodle-wiggle 0.5s ease-in-out infinite;
      }

      .topbar-right {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }

      /* 导航小图标按钮 */
      .topbar-icon {
        background: var(--paper);
        border: 2px solid var(--border);
        font-size: 1.1rem;
        cursor: pointer;
        color: var(--text);
        padding: 6px 10px;
        transform: rotate(2deg) skewX(-4deg);
        border-radius: var(--sketch-radius-btn);
        box-shadow: 3px 3px 0px var(--border);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.15s ease;
      }
      .topbar-icon > * {
        transform: skewX(4deg) rotate(-2deg);
      }
      .topbar-icon:hover {
        background: var(--accent);
        transform: rotate(0deg) scale(1.05) translateY(-2px);
        box-shadow: 4px 4px 0px var(--border);
      }
      .topbar-icon:active {
        transform: translate(2px, 2px);
        box-shadow: 0px 0px 0px var(--border);
      }

      /* 发布按钮大胶囊 */
      .publish-pill {
        background: #ffffff;
        border: 2px solid var(--border);
        color: #323232 !important;
        padding: 6px 18px;
        font-size: 0.9rem;
        font-weight: 900;
        text-transform: uppercase;
        transform: rotate(-1deg) skewX(-6deg);
        cursor: pointer;
        border-radius: var(--sketch-radius-btn);
        box-shadow: 3px 3px 0px var(--accent);
        transition: all 0.15s ease;
      }
      body.dark .publish-pill {
        background: #2d2a26;
        color: var(--text) !important;
      }
      .publish-pill:hover {
        background: var(--accent);
        color: var(--ink) !important;
        transform: rotate(-2deg) translateY(-2px);
        box-shadow: 4px 4px 0px var(--border);
      }
      .publish-pill:active {
        transform: translate(2px, 2px);
        box-shadow: 0px 0px 0px var(--border);
      }

      main {
        padding: 0 16px;
        padding-bottom: 60px;
      }
      #postsContainer {
        padding-top: 16px;
      }

      /* ==========================================
   METAPHOR CARD V3 - 核心不规则涂鸦卡片
   ========================================== */
      .post {
        margin: 28px 0;
        padding: 24px;
        background: var(--paper);
        border: 2px solid var(--border);
        border-radius: var(--sketch-radius-1);
        transform: var(--p-skew);
        display: flex;
        flex-direction: column;
        position: relative;
        overflow: visible;
        box-shadow: var(--p-shadow);
        transition:
          transform 0.22s cubic-bezier(0.175, 0.885, 0.32, 1.275),
          box-shadow 0.22s ease,
          border-color 0.22s ease;
        /* 登录页同款米白信纸暗纹线效果 */
        background-image: repeating-linear-gradient(
          transparent,
          transparent 28px,
          rgba(0, 0, 0, 0.03) 28px,
          rgba(0, 0, 0, 0.05) 30px
        );
      }

      .post:nth-child(even) {
        border-radius: var(--sketch-radius-2);
        transform: rotate(0.6deg) skewX(0.5deg);
      }

      /* 底层趣味手绘阴影效果 */
      .post::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: 0;
        z-index: -1;
        box-shadow:
          0 0 0 2px transparent,
          8px 8px 0px var(--gold-glow);
        transition:
          opacity 0.22s ease,
          transform 0.22s ease;
      }

      /* 右下角断裂撕纸点缀效果 */
      .post::after {
        content: "";
        position: absolute;
        width: 32px;
        height: 32px;
        right: -2px;
        bottom: -2px;
        opacity: 0;
        pointer-events: none;
        background: linear-gradient(
          135deg,
          transparent 0 45%,
          var(--accent) 45% 55%,
          transparent 55%
        );
        transition:
          opacity 0.22s ease,
          transform 0.22s ease;
      }

      .post:hover {
        transform: rotate(-1.5deg) skewX(-1deg) translate(-4px, -4px);
        border-color: var(--accent-dark);
        box-shadow: 6px 6px 0px var(--border);
      }
      .post:hover::before {
        opacity: 1;
        transform: translate(4px, 4px);
      }
      .post:hover::after {
        opacity: 1;
        transform: rotate(8deg);
      }

      .post-right {
        transform: var(--p-skew-anti);
        flex-grow: 1;
        overflow: hidden;
        min-width: 0;
      }
      .post-header {
        display: flex;
        align-items: center;
        margin-bottom: 14px;
        border-bottom: 2px dashed var(--border);
        padding-bottom: 8px;
      }

      .post-time {
        color: var(--ink);
        background: var(--accent);
        padding: 3px 12px;
        font-size: 0.8rem;
        font-weight: 900;
        letter-spacing: 0.5px;
        display: inline-block;
        transform: rotate(-2deg) skewX(-4deg);
        border: 2px solid var(--border);
        border-radius: var(--sketch-radius-btn);
      }
      .post-time::before {
        content: "📓 // ";
        color: var(--ink);
      }

      .post-content {
        font-size: 1rem;
        line-height: 1.7;
        word-wrap: break-word;
        font-family: -apple-system, sans-serif;
        font-weight: 500;
      }
      .post-content p {
        margin-top: 0;
        margin-bottom: 8px;
      }
      .post-content blockquote {
        margin: 16px 0;
        padding: 12px 16px;
        background: var(--border);
        color: var(--paper);
        border-left: 6px solid var(--accent);
        font-style: normal;
        font-weight: 900;
        border-radius: var(--sketch-radius-btn);
        transform: rotate(0.5deg);
      }
      .post-content code {
        background: var(--accent);
        color: var(--ink);
        padding: 3px 7px;
        font-size: 0.88rem;
        font-weight: bold;
        border-radius: 4px;
      }
      .post-content ul,
      .post-content ol {
        padding-left: 0;
        margin-bottom: 8px;
        list-style: none;
      }
      .post-content li {
        list-style: none !important;
        margin-bottom: 4px;
      }
      .post-content input[type="checkbox"] {
        margin-right: 6px;
        vertical-align: middle;
        cursor: not-allowed;
      }

      /* 图片多图拖拽容器外观 */
      .post-images {
        overflow: hidden;
        padding: 12px 0 4px;
        cursor: grab;
        contain: layout;
      }
      .post-images.dragging {
        cursor: grabbing;
      }
      .img-slide {
        display: flex;
        position: relative;
        gap: 12px;
        will-change: transform;
      }
      .post-images.single-image img {
        width: auto;
        max-width: 100%;
        height: auto;
        max-height: 380px;
        display: block;
      }
      .post-images img {
        height: 190px;
        width: auto;
        max-width: 85%;
        object-fit: cover;
        border: 2px solid var(--border);
        filter: brightness(var(--img-brightness));
        border-radius: var(--sketch-radius-1);
        box-shadow: 3px 3px 0px var(--border);
        transition: all 0.2s;
        user-select: none;
        -webkit-user-drag: none;
      }
      .post-images img:hover {
        border-color: var(--accent);
        transform: scale(1.02) rotate(1deg);
        box-shadow: 4px 4px 0px var(--border);
      }

      /* 斜切模块点 */
      .img-dots {
        display: flex;
        justify-content: center;
        gap: 6px;
        margin-top: 14px;
      }
      .img-dots .dot {
        width: 12px;
        height: 6px;
        background: var(--dot-normal);
        transform: skewX(-20deg);
        transition: all 0.15s ease;
        cursor: pointer;
        border: 1px solid var(--border);
      }
      .img-dots .dot.active {
        background: var(--dot-active);
        width: 24px;
      }
      #loader {
        text-align: center;
        padding: 40px;
        color: var(--secondary-text);
        font-weight: 900;
        transform: rotate(-1deg);
      }

      /* ==========================================
   P5高级重型手绘灯箱
   ========================================== */
      .lightbox {
        display: none;
        position: fixed;
        inset: 0;
        background: var(--lightbox-bg);
        z-index: 300000;
        justify-content: center;
        align-items: center;
        transition: opacity 0.25s ease;
      }
      .lightbox.lb-closing {
        opacity: 0;
      }
      #lbImg {
        max-width: 80%;
        max-height: 82%;
        object-fit: contain;
        border: 3px solid var(--border);
        background: var(--paper);
        box-shadow: var(--p-shadow);
        z-index: 2100;
        border-radius: var(--sketch-radius-1);
        user-select: none;
        -webkit-user-drag: none;
        touch-action: none;
        transform-origin: center center;
        will-change: transform;
      }
      .lb-counter {
        position: absolute;
        top: 24px;
        right: 24px;
        margin-right: 12px;
        background: var(--accent);
        color: var(--ink);
        border: 2px solid var(--border);
        padding: 8px 20px;
        font-weight: 900;
        font-size: 1.05rem;
        letter-spacing: 0.5px;
        transform: rotate(2deg) skewX(-8deg);
        z-index: 3000;
        box-shadow: 4px 4px 0px var(--border);
        border-radius: var(--sketch-radius-btn);
      }
      .lb-counter::before {
        content: "👁️ ";
        color: var(--ink);
        display: inline-block;
        margin-right: 6px;
      }

      .lb-btn {
        position: absolute;
        background: var(--lightbox-btn-bg);
        color: var(--lightbox-btn-color) !important;
        border: 2px solid var(--border);
        width: 46px;
        height: 46px;
        font-size: 1.2rem;
        font-weight: 900;
        border-radius: var(--sketch-radius-btn);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: var(--lightbox-shadow);
        z-index: 3100;
        transition: all 0.15s ease;
      }
      #lbCloseBtn {
        top: 24px;
        left: 24px;
        transform: rotate(-3deg) skewX(-6deg);
      }
      #lbCloseBtn:hover {
        background: var(--accent);
        color: var(--ink) !important;
        transform: rotate(-5deg) scale(1.05) !important;
      }
      .nav-btn {
        top: 50%;
        transform: translateY(-50%) rotate(3deg) skewX(-6deg);
      }
      #lbPrevBtn {
        left: 24px;
      }
      #lbNextBtn {
        right: 24px;
      }
      .lb-btn:hover {
        background: var(--text);
        color: var(--paper) !important;
        border-color: var(--text);
        box-shadow: 0 0 0 transparent;
      }
      .nav-btn:hover {
        transform: translateY(-50%) rotate(-3deg) scale(1.05) !important;
      }

      /* ==========================================
   全屏手绘搜素面板
   ========================================== */
      .search-modal {
        position: fixed;
        inset: 0;
        background: rgba(243, 233, 221, 0.97);
        backdrop-filter: blur(18px);
        z-index: 200000;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding: 60px 20px 20px;
        overflow-y: auto;
      }
      body.dark .search-modal {
        background: rgba(26, 25, 23, 0.97);
      }
      .search-modal.open {
        display: flex;
      }

      /* 涂鸦式滚动条定制 */
      .search-modal::-webkit-scrollbar,
      .search-results::-webkit-scrollbar,
      .app-container::-webkit-scrollbar,
      .publish-panel::-webkit-scrollbar {
        width: 12px;
        height: 10px;
      }
      .search-modal::-webkit-scrollbar-track,
      .search-results::-webkit-scrollbar-track,
      .app-container::-webkit-scrollbar-track,
      .publish-panel::-webkit-scrollbar-track {
        background: var(--bg);
      }
      .search-modal::-webkit-scrollbar-thumb,
      .search-results::-webkit-scrollbar-thumb,
      .app-container::-webkit-scrollbar-thumb,
      .publish-panel::-webkit-scrollbar-thumb {
        background: var(--border);
        border: 2px solid var(--bg);
        border-radius: 0px !important;
      }
      .search-modal::-webkit-scrollbar-thumb:hover,
      .search-results::-webkit-scrollbar-thumb:hover,
      .app-container::-webkit-scrollbar-thumb:hover,
      .publish-panel::-webkit-scrollbar-thumb:hover {
        background: var(--accent);
      }

      .search-modal-header {
        width: 100%;
        max-width: 700px;
        margin-bottom: 30px;
        display: flex;
        gap: 12px;
        align-items: center;
        background: var(--paper);
        border: 2px solid var(--border);
        padding: 8px 12px 8px 18px;
        box-shadow: 5px 5px 0 var(--border);
        border-radius: var(--sketch-radius-1);
      }
      .search-modal-header input {
        flex: 1;
        min-width: 0;
        background: transparent;
        border: none;
        font-size: 1rem;
        font-family: inherit;
        padding: 10px 0;
        outline: none;
        color: var(--text);
        font-weight: 700;
      }
      .search-modal-header button {
        background: var(--accent);
        border: 2px solid var(--border);
        padding: 8px 20px;
        cursor: pointer;
        font-family: inherit;
        font-weight: 900;
        color: var(--ink);
        font-size: 1rem;
        border-radius: var(--sketch-radius-btn);
        white-space: nowrap;
        user-select: none;
        flex-shrink: 0;
        box-shadow: 3px 3px 0 var(--border);
        transition: all 0.15s ease;
      }
      .search-modal-header button:hover {
        transform: translateY(-2px);
        box-shadow: 4px 4px 0 var(--border);
      }

      .search-results {
        width: 100%;
        max-width: 700px;
        margin: 0 auto;
      }
      .search-results .post {
        margin: 0 0 18px;
        transform: none;
      }
      .search-results .post:hover {
        transform: translate(-3px, -3px) rotate(-0.5deg);
      }
      .search-results .post-right {
        transform: none;
      }
      .search-loader {
        text-align: center;
        padding: 30px;
        color: var(--secondary-text);
        font-weight: 900;
      }

      .close-search-btn {
        position: absolute;
        top: 20px;
        right: 30px;
        width: 44px;
        height: 44px;
        background: var(--paper);
        border: 2px solid var(--border);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.5rem;
        color: var(--text);
        transition: all 0.2s;
        border-radius: var(--sketch-radius-btn);
        user-select: none;
        box-shadow: 4px 4px 0 var(--accent);
      }
      .close-search-btn:hover {
        transform: scale(1.05) rotate(5deg);
        background: var(--accent);
        color: var(--ink);
      }

      /* ==========================================
   重型涂鸦撕纸风发布面板
   ========================================== */
      .publish-mask {
        position: fixed;
        inset: 0;
        background: rgba(5, 5, 5, 0.6);
        backdrop-filter: blur(4px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        z-index: 99999;
      }
      .publish-panel {
        width: min(100%, 600px);
        max-height: min(85vh, 850px);
        overflow: auto;
        background: var(--paper);
        color: var(--text);
        border: 2px solid var(--border);
        border-radius: var(--sketch-radius-1);
        box-shadow: var(--p-shadow);
        padding: 26px;
        transform: rotate(0.5deg);
        background-image: repeating-linear-gradient(
          transparent,
          transparent 28px,
          rgba(0, 0, 0, 0.02) 28px,
          rgba(0, 0, 0, 0.04) 30px
        );
      }
      .publish-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 20px;
        border-bottom: 2px solid var(--border);
        padding-bottom: 12px;
      }
      .publish-title {
        margin: 0;
        font-size: 1.25rem;
        font-weight: 900;
        text-transform: uppercase;
        transform: skewX(-6deg) rotate(-1deg);
        color: var(--accent-dark);
      }
      .publish-close {
        border: 2px solid var(--border);
        background: transparent;
        color: var(--text);
        width: 28px;
        height: 28px;
        border-radius: var(--sketch-radius-btn);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 900;
      }
      .publish-close:hover {
        background: var(--accent);
        color: var(--ink);
        transform: rotate(10deg);
      }
      .publish-field {
        margin-bottom: 18px;
      }
      .publish-label {
        display: block;
        font-size: 0.85rem;
        font-weight: 900;
        color: var(--text);
        margin-bottom: 6px;
        text-transform: uppercase;
        transform: rotate(-1deg);
      }

      /* 发布表单输入框样式完美等同于登录页输入框 */
      .publish-input,
      .publish-textarea {
        width: 100%;
        border: 2px solid var(--border);
        background: #ffffff;
        color: #323232;
        padding: 12px;
        outline: none;
        font-family: -apple-system, sans-serif;
        font-weight: bold;
        border-radius: var(--sketch-radius-1);
        box-shadow: 3px 3px 0px var(--border);
        transition: all 0.2s;
      }
      body.dark .publish-input,
      body.dark .publish-textarea {
        background: #2d2a26; /* 与卡片背景一致 */
        color: #f3e9dd; /* 浅色文字 */
        border-color: var(--border);
      }
      .publish-input:focus,
      .publish-textarea:focus {
        border-color: var(--accent);
        border-radius: var(--sketch-radius-2);
        box-shadow: 4px 4px 0px var(--border);
        background: #fffef7; /* 极淡的奶油黄，手账纸质感 */
      }
      body.dark .publish-input:focus,
      body.dark .publish-textarea:focus {
        background: #3a3834; /* 聚焦时略亮 */
      }

      .publish-tools {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 12px;
      }
      .pick-img-btn {
        border: 2px solid var(--border);
        background: var(--paper);
        color: var(--text);
        padding: 6px 14px;
        border-radius: var(--sketch-radius-btn);
        cursor: pointer;
        font-size: 0.82rem;
        font-weight: 900;
        transform: skewX(-4deg);
        box-shadow: 2px 2px 0px var(--border);
        transition: all 0.1s;
      }
      .pick-img-btn:hover {
        background: var(--accent);
        color: var(--ink);
        transform: translateY(-1px);
        box-shadow: 3px 3px 0px var(--border);
      }

      .preview-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
        gap: 8px;
        margin-top: 8px;
      }
      .preview-item {
        position: relative;
        border: 2px solid var(--border);
        border-radius: var(--sketch-radius-btn);
        overflow: hidden;
        padding: 2px;
        background: var(--paper);
        aspect-ratio: 1/1;
      }
      .preview-item img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .preview-del {
        position: absolute;
        top: 4px;
        right: 4px;
        width: 22px;
        height: 22px;
        border: 1px solid var(--border);
        border-radius: 4px;
        cursor: pointer;
        background: var(--accent);
        color: var(--ink);
        font-size: 11px;
        font-weight: 900;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .publish-footer {
        display: flex;
        gap: 12px;
        margin-top: 24px;
      }
      .publish-submit,
      .publish-cancel {
        border: 2px solid var(--border);
        border-radius: var(--sketch-radius-btn);
        cursor: pointer;
        padding: 12px 20px;
        font-size: 0.95rem;
        font-weight: 900;
        transform: skewX(-6deg);
        transition: all 0.15s ease;
      }
      .publish-submit {
        flex: 1;
        background: var(--accent);
        color: var(--ink);
        box-shadow: 4px 4px 0px var(--border);
      }
      .publish-submit:hover:not(:disabled) {
        background: var(--text);
        color: var(--paper);
        box-shadow: 0 0 0 transparent;
        transform: skewX(-6deg) translate(3px, 3px);
      }
      .publish-cancel {
        min-width: 90px;
        background: transparent;
        color: var(--secondary-text);
      }
      .publish-submit:disabled {
        opacity: 0.3;
        cursor: not-allowed;
      }
      .publish-empty,
      .publish-tip {
        color: var(--secondary-text);
        font-size: 0.85rem;
        font-weight: 700;
      }
      .publish-textarea {
        min-height: 120px;
        resize: vertical;
      }

      /* ==========================================
   斜剪风格动态气泡 Toast
   ========================================== */
      .toast-wrap {
        position: fixed;
        top: calc(28px + var(--safe-top));
        left: 50%;
        transform: translateX(-50%);
        z-index: 100000;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .toast {
        min-width: 270px;
        padding: 14px 24px;
        background: var(--paper);
        color: var(--ink);
        border: 2px solid var(--border);
        font-size: 0.95rem;
        font-weight: 900;
        text-align: center;
        border-radius: var(--sketch-radius-btn);
        transform: skewX(-12deg) rotate(-1deg);
        box-shadow: 4px 4px 0px var(--border);
        opacity: 0;
        animation: pToastIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275)
          forwards;
      }
      .toast.success {
        color: #d4924f;
      }
      .toast.success::before {
        content: "✍️ 手账已收录 // ";
      }
      .toast.error {
        background: #ffccd5;
        color: #c0392b;
      }
      .toast.error::before {
        content: "💔 这一页撕坏了 // ";
      }
      .toast.hide {
        animation: pToastOut 0.2s ease forwards;
      }
      @keyframes pToastIn {
        to {
          opacity: 1;
          transform: skewX(-12deg) rotate(-1deg);
        }
      }
      @keyframes pToastOut {
        to {
          opacity: 0;
          transform: translateY(-10px) skewX(-12deg);
        }
      }

      /* Wiggle 摇晃动态核心库 */
      @keyframes doodle-wiggle {
        0%,
        100% {
          transform: rotate(-3deg) skewX(-4deg);
        }
        25% {
          transform: rotate(1deg) skewX(-2deg);
        }
        50% {
          transform: rotate(-4deg) skewX(-4deg);
        }
        75% {
          transform: rotate(2deg) skewX(-3deg);
        }
      }

      @media (max-width: 768px) {
        body {
          padding: 0;
        }
        .app-container {
          max-width: 100%;
          border-left: none;
          border-right: none;
        }
        .topbar-inner {
          padding: 12px 14px;
        }
        .blog-brand {
          font-size: 1.15rem;
          padding: 6px 12px;
        }
        main {
          padding: 0 10px;
        }
        .post {
          margin: 16px 0;
          padding: 16px;
          border-width: 2px;
          box-shadow: 4px 4px 0px var(--border);
        }
        .post:hover {
          transform: rotate(-0.8deg) skewX(-1deg) translate(-2px, -2px);
        }
        body.dark .post {
          box-shadow: 4px 4px 0px var(--border);
        }
        .post-content {
          font-size: 0.95rem;
        }
        .post-images img {
          height: 150px;
          border-width: 2px;
        }
        .nav-btn {
          display: none !important;
        }
        #lbImg {
          max-width: 95%;
          max-height: 75%;
          border: 2px solid var(--border);
        }
        .lb-counter {
          top: calc(20px + var(--safe-top));
          left: 50% !important;
          right: auto !important;
          margin-right: 0;
          transform: translateX(-50%) rotate(2deg) skewX(-8deg);
        }
        #lbCloseBtn {
          top: calc(18px + var(--safe-top));
          left: 16px;
          width: 38px;
          height: 38px;
        }
        .publish-mask {
          padding: 0;
          align-items: flex-end;
        }
        .publish-panel {
          width: 100%;
          max-height: 80vh;
          padding: 20px 16px;
          border-bottom: none;
          border-left: none;
          border-right: none;
          border-style: solid;
          box-shadow: 0 -6px 0px var(--accent);
          transform: none;
          border-radius: 20px 20px 0 0;
        }
        .publish-footer {
          margin-top: 16px;
          padding-bottom: var(--safe-bottom);
        }
        .search-modal {
          padding: calc(56px + env(safe-area-inset-top)) 12px
            calc(16px + env(safe-area-inset-bottom));
        }
        .search-modal-header {
          width: 100%;
          padding: 4px 8px 4px 14px;
          gap: 6px;
          margin-bottom: 16px;
        }
        .search-modal-header input {
          font-size: 1rem;
          padding: 10px 0;
          min-width: 0;
        }
        .search-modal-header button {
          padding: 8px 14px;
          font-size: 0.9rem;
        }
        .close-search-btn {
          top: calc(10px + env(safe-area-inset-top));
          right: 14px;
          width: 40px;
          height: 40px;
        }
        .search-results {
          width: 100%;
          padding: 0;
        }
        .search-results .post {
          padding: 12px;
          margin-bottom: 12px;
          font-size: 0.95rem;
        }
      }
      @media (max-width: 480px) {
        #modalSearchInput,
        .publish-input,
        .publish-textarea {
          font-size: 16px !important;
        }
        .post-images img {
          height: 130px;
        }
      }

      /* ==========================================
   回到顶部按钮 - 手绘风格 (修复可见性)
   ========================================== */
      .back-to-top {
        position: fixed;
        bottom: calc(28px + var(--safe-bottom));
        right: 20px;
        width: 46px;
        height: 46px;
        background: var(--paper);
        color: var(--text);
        border: 2px solid var(--border);
        border-radius: var(--sketch-radius-btn);
        box-shadow: 4px 4px 0px var(--border);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.3rem;
        font-weight: 900;
        transform: rotate(3deg) skewX(-5deg);
        z-index: 9000;
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 0.25s ease,
          transform 0.15s ease,
          background 0.15s ease,
          box-shadow 0.15s ease;
      }
      .back-to-top.visible {
        opacity: 1;
        pointer-events: auto;
      }
      .back-to-top:hover {
        background: var(--accent);
        color: var(--ink);
        transform: rotate(0deg) scale(1.08) translateY(-3px);
        box-shadow: 5px 5px 0px var(--border);
      }
      .back-to-top:active {
        transform: translate(3px, 3px) rotate(2deg);
        box-shadow: 0px 0px 0px var(--border);
      }
      @media (max-width: 768px) {
        .back-to-top {
          bottom: calc(20px + var(--safe-bottom));
          right: 14px;
          width: 42px;
          height: 42px;
          font-size: 1.15rem;
        }
      }

      /* ==========================================
   图片左右切换按钮 - 手绘风格
   ========================================== */
      .post-images-wrap {
        position: relative;
      }
      .img-nav-btn {
        position: absolute;
        top: 50%;
        transform: translateY(-60%) rotate(2deg) skewX(-5deg);
        width: 34px;
        height: 34px;
        background: var(--paper);
        color: var(--text);
        border: 2px solid var(--border);
        border-radius: var(--sketch-radius-btn);
        box-shadow: 3px 3px 0px var(--border);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1rem;
        font-weight: 900;
        z-index: 10;
        transition: all 0.15s ease;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      .img-nav-btn:hover {
        background: var(--accent);
        color: var(--ink);
        transform: translateY(-60%) rotate(-2deg) scale(1.08);
        box-shadow: 4px 4px 0px var(--border);
      }
      .img-nav-btn:active {
        transform: translateY(-58%) translate(2px, 2px);
        box-shadow: 0 0 0 var(--border);
      }
      .img-nav-prev {
        left: 4px;
      }
      .img-nav-next {
        right: 4px;
      }
      .img-nav-btn.hidden {
        opacity: 0;
        pointer-events: none;
      }
      @media (max-width: 768px) {
        .img-nav-btn {
          width: 30px;
          height: 30px;
          font-size: 0.9rem;
        }
      }

      /* 漂浮装饰（手账风格） */
      .doodle-star,
      .doodle-sparkle,
      .doodle-swirl {
        position: fixed;
        z-index: 9999;
        pointer-events: none;
        width: 48px;
        height: 48px;
        opacity: 0.7;
      }
      .doodle-star {
        top: 20px;
        left: 20px;
        animation: float-star 5s ease-in-out infinite;
      }
      .doodle-sparkle {
        bottom: 30px;
        right: 30px;
        width: 40px;
        height: 40px;
        animation: float-sparkle 6s ease-in-out infinite 1s;
      }
      .doodle-swirl {
        top: 40%;
        right: 15px;
        width: 32px;
        height: 32px;
        animation: float-swirl 7s ease-in-out infinite 2s;
      }
      @keyframes float-star {
        0%,
        100% {
          transform: translateY(0) rotate(-15deg);
        }
        50% {
          transform: translateY(-8px) rotate(-10deg);
        }
      }
      @keyframes float-sparkle {
        0%,
        100% {
          transform: translateY(0) rotate(10deg);
        }
        50% {
          transform: translateY(-8px) rotate(15deg);
        }
      }
      @keyframes float-swirl {
        0%,
        100% {
          transform: translateY(0) rotate(0deg);
        }
        50% {
          transform: translateY(-8px) rotate(5deg);
        }
      }

      /* 暗色模式下装饰颜色微调 */
      body.dark .doodle-star {
        fill: #daa06d;
        stroke: #f3e9dd;
      }
      body.dark .doodle-sparkle {
        fill: #b8875a;
        stroke: #f3e9dd;
      }
      body.dark .doodle-swirl {
        stroke: #f3e9dd;
      }

      /* 新增手账漂浮装饰 */
      /* ===== 手账漂浮装饰 ===== */
      .doodle-star,
      .doodle-sparkle,
      .doodle-swirl,
      .doodle-flower,
      .doodle-plane,
      .doodle-clip,
      .doodle-moon,
      .doodle-leaf {
        position: fixed;
        z-index: 9999;
        pointer-events: none;
        will-change: transform;
      }

      /* 单个元素尺寸与初始位置 */
      .doodle-star {
        top: 20px;
        left: 20px;
        width: 48px;
        height: 48px;
        animation: floatStar 11s ease-in-out infinite;
      }
      .doodle-sparkle {
        bottom: 30px;
        right: 30px;
        width: 40px;
        height: 40px;
        animation: floatSparkle 14s ease-in-out infinite 1.2s;
      }
      .doodle-swirl {
        top: 35%;
        right: 15px;
        width: 32px;
        height: 32px;
        animation: floatSwirl 9s ease-in-out infinite 2.5s;
      }
      .doodle-flower {
        bottom: 15%;
        left: 3%;
        width: 30px;
        height: 30px;
        animation: floatFlower 13s ease-in-out infinite 0.8s;
      }
      .doodle-plane {
        top: 20%;
        right: 2%;
        width: 34px;
        height: 34px;
        animation: floatPlane 16s ease-in-out infinite 1.5s;
      }
      .doodle-clip {
        top: 35%;
        left: 2%;
        width: 28px;
        height: 28px;
        animation: floatClip 10s ease-in-out infinite 3s;
      }
      .doodle-moon {
        bottom: 25%;
        right: 4%;
        width: 32px;
        height: 32px;
        animation: floatMoon 12s ease-in-out infinite 0.5s;
      }
      .doodle-leaf {
        top: 60%;
        left: 5%;
        width: 28px;
        height: 28px;
        animation: floatLeaf 15s ease-in-out infinite 2s;
      }

      /* 不规则飘浮动效 */
      @keyframes floatStar {
        0% {
          transform: translate(0, 0) rotate(-15deg) scale(1);
        }
        25% {
          transform: translate(12px, -18px) rotate(-8deg) scale(1.05);
        }
        50% {
          transform: translate(-8px, -30px) rotate(2deg) scale(0.95);
        }
        75% {
          transform: translate(18px, -12px) rotate(-4deg) scale(1.02);
        }
        100% {
          transform: translate(0, 0) rotate(-15deg) scale(1);
        }
      }
      @keyframes floatSparkle {
        0% {
          transform: translate(0, 0) rotate(10deg) scale(1);
        }
        30% {
          transform: translate(-15px, -20px) rotate(18deg) scale(1.08);
        }
        60% {
          transform: translate(10px, -35px) rotate(5deg) scale(0.92);
        }
        100% {
          transform: translate(0, 0) rotate(10deg) scale(1);
        }
      }
      @keyframes floatSwirl {
        0% {
          transform: translate(0, 0) rotate(0deg);
        }
        20% {
          transform: translate(8px, -12px) rotate(6deg);
        }
        40% {
          transform: translate(-12px, -25px) rotate(-4deg);
        }
        60% {
          transform: translate(6px, -8px) rotate(3deg);
        }
        80% {
          transform: translate(-4px, -18px) rotate(-2deg);
        }
        100% {
          transform: translate(0, 0) rotate(0deg);
        }
      }
      @keyframes floatFlower {
        0% {
          transform: translate(0, 0) rotate(0deg);
        }
        33% {
          transform: translate(10px, -14px) rotate(6deg);
        }
        66% {
          transform: translate(-6px, -26px) rotate(-3deg);
        }
        100% {
          transform: translate(0, 0) rotate(0deg);
        }
      }
      @keyframes floatPlane {
        0% {
          transform: translate(0, 0) rotate(-8deg);
        }
        25% {
          transform: translate(-18px, -12px) rotate(-2deg);
        }
        50% {
          transform: translate(8px, -28px) rotate(4deg);
        }
        75% {
          transform: translate(-10px, -16px) rotate(-6deg);
        }
        100% {
          transform: translate(0, 0) rotate(-8deg);
        }
      }
      @keyframes floatClip {
        0% {
          transform: translate(0, 0) rotate(0deg) skewX(0deg);
        }
        35% {
          transform: translate(14px, -10px) rotate(10deg) skewX(4deg);
        }
        70% {
          transform: translate(-5px, -22px) rotate(-5deg) skewX(-2deg);
        }
        100% {
          transform: translate(0, 0) rotate(0deg) skewX(0deg);
        }
      }
      @keyframes floatMoon {
        0% {
          transform: translate(0, 0) rotate(0deg) scale(1);
        }
        40% {
          transform: translate(-8px, -18px) rotate(8deg) scale(1.06);
        }
        80% {
          transform: translate(12px, -30px) rotate(-4deg) scale(0.94);
        }
        100% {
          transform: translate(0, 0) rotate(0deg) scale(1);
        }
      }
      @keyframes floatLeaf {
        0% {
          transform: translate(0, 0) rotate(-3deg);
        }
        25% {
          transform: translate(6px, -10px) rotate(1deg);
        }
        50% {
          transform: translate(-14px, -22px) rotate(5deg);
        }
        75% {
          transform: translate(8px, -14px) rotate(-2deg);
        }
        100% {
          transform: translate(0, 0) rotate(-3deg);
        }
      }

      /* 暗黑模式下装饰颜色微调 */
      body.dark .doodle-star {
        fill: #daa06d;
        stroke: #f3e9dd;
      }
      body.dark .doodle-sparkle {
        fill: #b8875a;
        stroke: #f3e9dd;
      }
      body.dark .doodle-swirl {
        stroke: #f3e9dd;
      }
      body.dark .doodle-flower {
        fill: #daa06d;
        stroke: #f3e9dd;
      }
      body.dark .doodle-plane {
        fill: #2d2a26;
        stroke: #f3e9dd;
      }
      body.dark .doodle-clip {
        stroke: #f3e9dd;
      }
      body.dark .doodle-moon {
        fill: #b8875a;
        stroke: #f3e9dd;
      }
      body.dark .doodle-leaf {
        fill: #5e7b5c;
        stroke: #f3e9dd;
      }
    </style>
  </head>
