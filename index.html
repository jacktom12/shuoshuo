    <script>
      (function () {
        const TMDB_WORKER = "https://tmdb.199105.xyz";
        const TMDB_IMG = "https://image.tmdb.org/t/p/w342";
        const MOVIE_GENRES = {
          28: "动作",
          12: "冒险",
          16: "动画",
          35: "喜剧",
          80: "犯罪",
          99: "纪录",
          18: "剧情",
          10751: "家庭",
          14: "奇幻",
          36: "历史",
          27: "恐怖",
          10402: "音乐",
          9648: "悬疑",
          10749: "爱情",
          878: "科幻",
          10770: "电视电影",
          53: "惊悚",
          10752: "战争",
          37: "西部",
        };
        const TV_GENRES = {
          10759: "动作冒险",
          16: "动画",
          35: "喜剧",
          80: "犯罪",
          99: "纪录",
          18: "剧情",
          10751: "家庭",
          10762: "儿童",
          9648: "悬疑",
          10763: "新闻",
          10764: "真人秀",
          10765: "科幻奇幻",
          10766: "肥皂剧",
          10767: "脱口秀",
          10768: "战争政治",
          37: "西部",
        };
        const ALL_GENRES = Object.assign({}, MOVIE_GENRES, TV_GENRES);

        const tmdbModal = document.getElementById("tmdbModal");
        const tmdbModalTitle = document.getElementById("tmdbModalTitle");
        const tmdbGenreRow = document.getElementById("tmdbGenreRow");
        const tmdbTypeTabs = document.getElementById("tmdbTypeTabs");
        const tmdbGrid = document.getElementById("tmdbGrid");
        const tmdbPagination = document.getElementById("tmdbPagination");
        const tmdbPaginationTop = document.getElementById("tmdbPaginationTop");
        const closeTmdbModal = document.getElementById("closeTmdbModal");
        const openWatchlistBtn = document.getElementById("openWatchlistBtn");
        const openWatchedBtn = document.getElementById("openWatchedBtn");
        const openTmdbAdminBtn = document.getElementById("openTmdbAdminBtn");

        const tmdbSearchBar = document.getElementById("tmdbSearchBar");
        const tmdbSearchInput = document.getElementById("tmdbSearchInput");
        const tmdbSearchBtn = document.getElementById("tmdbSearchBtn");

        let tmdbMode = "watchlist";
        let tmdbRawItems = [];
        let tmdbMediaFilter = "all";
        let tmdbSelectedGenres = new Set();
        let tmdbPage = 1;
        const TMDB_PAGE_SIZE = 10;

        function esc(v) {
          return String(v ?? "").replace(/[&<>"']/g, (c) => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;",
          })[c]);
        }

        async function tmdbRequest(url, options = {}) {
          const res = await fetch(url, options);
          const json = await res.json().catch(() => ({}));
          if (!res.ok || (json.code && json.code !== 0)) {
            throw new Error(json.msg || json.status_message || `请求失败 ${res.status}`);
          }
          return json;
        }

        async function tmdbFetchJSON(type, page) {
          return tmdbRequest(`${TMDB_WORKER}?type=${encodeURIComponent(type)}&page=${page || 1}`);
        }

        async function tmdbSearch(query, page) {
          return tmdbRequest(`${TMDB_WORKER}?action=search&query=${encodeURIComponent(query)}&page=${page || 1}`);
        }

        async function tmdbAdd(action, mediaId, mediaType) {
          return tmdbRequest(TMDB_WORKER, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              action,
              media_id: Number(mediaId),
              media_type: mediaType,
            }),
          });
        }

        function normalizeItem(it, fallbackMediaType = null) {
          const mediaType = it.media_type || fallbackMediaType || (it.title ? "movie" : "tv");
          const title = it.display_title || it.title || it.name || it.original_title || it.original_name || "";
          const dateStr = mediaType === "movie" ? it.release_date : it.first_air_date;

          return {
            id: it.id,
            media_type: mediaType,
            title,
            poster_path: it.poster_path || null,
            backdrop_path: it.backdrop_path || null,
            overview: it.overview || "",
            year: dateStr ? String(dateStr).slice(0, 4) : "",
            lang: (it.original_language || "").toUpperCase(),
            genre_ids: Array.isArray(it.genre_ids) ? it.genre_ids : [],
            vote_average: it.vote_average ?? null,
            vote_count: it.vote_count ?? null,
            release_date: it.release_date || null,
            first_air_date: it.first_air_date || null,
          };
        }

        async function loadWatchlistItems() {
          const collect = async (type, fallbackType) => {
            const first = await tmdbFetchJSON(type, 1);
            const items = (first.results || []).map((it) => normalizeItem(it, fallbackType));
            const totalPages = first.total_pages || 1;
            if (totalPages > 1) {
              const rest = await Promise.all(
                Array.from({ length: totalPages - 1 }, (_, i) => tmdbFetchJSON(type, i + 2)),
              );
              rest.forEach((data) => {
                (data.results || []).forEach((it) => items.push(normalizeItem(it, fallbackType)));
              });
            }
            return items;
          };

          const [movies, tv] = await Promise.all([
            collect("watchlist_movies", "movie"),
            collect("watchlist_tv", "tv"),
          ]);

          return movies.concat(tv);
        }

        async function loadWatchedItems() {
          const first = await tmdbFetchJSON("watched", 1);
          const all = (first.results || []).map((it) => normalizeItem(it, it.media_type));
          const totalPages = first.total_pages || 1;

          if (totalPages > 1) {
            const rest = await Promise.all(
              Array.from({ length: totalPages - 1 }, (_, i) => tmdbFetchJSON("watched", i + 2)),
            );
            rest.forEach((data) => {
              (data.results || []).forEach((it) => all.push(normalizeItem(it, it.media_type)));
            });
          }

          return all;
        }

        function renderGenreChips() {
          const chips = Object.entries(ALL_GENRES)
            .map(([id, name]) => {
              const active = tmdbSelectedGenres.has(Number(id));
              return `<button class="tmdb-genre-chip ${active ? "active" : ""}" data-genre="${id}">${esc(name)}</button>`;
            })
            .join("");

          tmdbGenreRow.innerHTML = `
            <button class="tmdb-genre-chip ${tmdbSelectedGenres.size === 0 ? "active" : ""}" data-genre="all">全部</button>
            ${chips}
          `;
        }

        function bindGenreChips() {
          tmdbGenreRow.querySelectorAll(".tmdb-genre-chip").forEach((chip) => {
            chip.onclick = () => {
              const gid = chip.dataset.genre;
              if (gid === "all") {
                tmdbSelectedGenres.clear();
              } else {
                const num = Number(gid);
                if (tmdbSelectedGenres.has(num)) tmdbSelectedGenres.delete(num);
                else tmdbSelectedGenres.add(num);
              }
              tmdbPage = 1;
              renderGenreChips();
              bindGenreChips();
              renderTmdbGrid();
            };
          });
        }

        function bindTypeTabs() {
          tmdbTypeTabs.querySelectorAll(".tmdb-tab").forEach((btn) => {
            btn.onclick = () => {
              tmdbTypeTabs.querySelectorAll(".tmdb-tab").forEach((b) => b.classList.remove("active"));
              btn.classList.add("active");
              tmdbMediaFilter = btn.dataset.media;
              tmdbPage = 1;
              renderTmdbGrid();
            };
          });
        }

        function getFilteredItems() {
          return tmdbRawItems.filter((it) => {
            if (tmdbMediaFilter !== "all" && it.media_type !== tmdbMediaFilter) return false;
            if (tmdbSelectedGenres.size === 0) return true;
            return [...tmdbSelectedGenres].every((gid) => it.genre_ids.includes(gid));
          });
        }

          function buildCardHTML(item) {
  const genreMap = item.media_type === "movie" ? MOVIE_GENRES : TV_GENRES;
  const genreNames = (item.genre_ids || []).map((g) => genreMap[g]).filter(Boolean).slice(0, 3).join(" / ");
  const typeLabel = item.media_type === "movie" ? "电影" : "电视剧";
  const metaBits = [typeLabel, item.year, item.lang].filter(Boolean).join(" · ");
  const tmdbUrl = `https://www.themoviedb.org/${item.media_type}/${item.id}?language=zh-CN`;
  // 豆瓣搜索链接
  const doubanUrl = `https://search.douban.com/movie/subject_search?search_text=${encodeURIComponent(item.title)}`;
  const posterHtml = item.poster_path
    ? `<img src="${TMDB_IMG}${item.poster_path}" alt="${esc(item.title)}" loading="lazy">`
    : "暂无海报";

  const adminActions = tmdbMode === "search"
    ? `
      <div class="tmdb-admin-actions">
        <button class="tmdb-admin-btn" data-kind="watchlist" data-id="${item.id}" data-media="${item.media_type}">想看</button>
        <button class="tmdb-admin-btn" data-kind="watched" data-id="${item.id}" data-media="${item.media_type}">看过</button>
        <a class="tmdb-douban-link" href="${doubanUrl}" target="_blank" rel="noopener noreferrer" title="在豆瓣查看">豆瓣</a>
      </div>
    `
    : `
      <div class="tmdb-admin-actions">
        <a class="tmdb-douban-link" href="${doubanUrl}" target="_blank" rel="noopener noreferrer" title="在豆瓣查看">豆瓣</a>
      </div>
    `;

  return `
    <div class="tmdb-card" data-id="${item.id}" data-media="${item.media_type}">
      <a class="tmdb-card-link" href="${tmdbUrl}" target="_blank" rel="noopener noreferrer">
        <div class="tmdb-card-poster ${item.poster_path ? "" : "placeholder"}">${posterHtml}</div>
      </a>
      <div class="tmdb-card-body">
        <a class="tmdb-card-link" href="${tmdbUrl}" target="_blank" rel="noopener noreferrer">
          <div class="tmdb-card-title">${esc(item.title)}</div>
          <div class="tmdb-card-meta">${esc(metaBits)}</div>
          ${genreNames ? `<div class="tmdb-card-genres">${esc(genreNames)}</div>` : ""}
        </a>
        ${adminActions}
      </div>
    </div>
  `;
}

        function renderPagination(totalItems) {
          const totalPages = Math.max(1, Math.ceil(totalItems / TMDB_PAGE_SIZE));
          if (tmdbPage > totalPages) tmdbPage = totalPages;

          if (totalPages <= 1) {
            tmdbPaginationTop.innerHTML = "";
            tmdbPagination.innerHTML = "";
            return;
          }

          let html = `<button class="tmdb-page-btn" data-action="prev" ${tmdbPage === 1 ? "disabled" : ""}>&lt;</button>`;
          const pages = new Set([1, totalPages, tmdbPage - 1, tmdbPage, tmdbPage + 1].filter((p) => p >= 1 && p <= totalPages));
          let last = 0;

          [...pages].sort((a, b) => a - b).forEach((p) => {
            if (last && p - last > 1) html += `<span class="tmdb-page-ellipsis">...</span>`;
            html += `<button class="tmdb-page-btn ${p === tmdbPage ? "active" : ""}" data-page="${p}">${p}</button>`;
            last = p;
          });

          html += `<button class="tmdb-page-btn" data-action="next" ${tmdbPage === totalPages ? "disabled" : ""}>&gt;</button>`;

          [tmdbPaginationTop, tmdbPagination].forEach((container) => {
            container.innerHTML = html;
            container.querySelectorAll("button").forEach((btn) => {
              btn.onclick = (e) => {
                e.stopPropagation();
                const action = btn.dataset.action;
                const page = btn.dataset.page;
                if (action === "prev" && tmdbPage > 1) tmdbPage--;
                else if (action === "next" && tmdbPage < totalPages) tmdbPage++;
                else if (page) tmdbPage = Number(page);
                renderTmdbGrid();
              };
            });
          });
        }

        function renderTmdbGrid() {
          const filtered = getFilteredItems();

          if (!filtered.length) {
            tmdbGrid.innerHTML = `<div class="tmdb-empty">${tmdbMode === "search" ? "没有搜索结果" : "这里还是空的"}</div>`;
            tmdbPaginationTop.innerHTML = "";
            tmdbPagination.innerHTML = "";
            return;
          }

          const start = (tmdbPage - 1) * TMDB_PAGE_SIZE;
          const pageItems = filtered.slice(start, start + TMDB_PAGE_SIZE);
          tmdbGrid.innerHTML = pageItems.map(buildCardHTML).join("");
          renderPagination(filtered.length);
          if (tmdbModal) tmdbModal.scrollTop = 0;
        }

        function openTmdbModalBase(mode, title) {
          tmdbMode = mode;
          tmdbMediaFilter = "all";
          tmdbSelectedGenres = new Set();
          tmdbPage = 1;
          tmdbModalTitle.textContent = title;
          tmdbTypeTabs.querySelectorAll(".tmdb-tab").forEach((b) => b.classList.toggle("active", b.dataset.media === "all"));
          renderGenreChips();
          bindGenreChips();
          bindTypeTabs();
          tmdbModal.classList.add("open");
          document.body.style.overflow = "hidden";
        }

        async function openTmdbModal(mode) {
          openTmdbModalBase(mode, mode === "watchlist" ? "想看" : "看过");
          tmdbSearchBar.style.display = "none";
          tmdbGrid.innerHTML = '<div class="tmdb-loading">载入中...</div>';
          tmdbPaginationTop.innerHTML = "";
          tmdbPagination.innerHTML = "";

          try {
            tmdbRawItems = mode === "watchlist" ? await loadWatchlistItems() : await loadWatchedItems();
            renderTmdbGrid();
          } catch (err) {
            tmdbGrid.innerHTML = `<div class="tmdb-error">${esc(String(err.message || err))}</div>`;
            if (typeof showToast === "function") showToast("加载影视数据失败", "error");
          }
        }

        function openTmdbSearchModal() {
          openTmdbModalBase("search", "添加影视剧");
          tmdbSearchBar.style.display = "flex";
          tmdbRawItems = [];
          tmdbGrid.innerHTML = '<div class="tmdb-empty">先搜一部电影或电视剧吧</div>';
          tmdbPaginationTop.innerHTML = "";
          tmdbPagination.innerHTML = "";
          setTimeout(() => tmdbSearchInput && tmdbSearchInput.focus(), 60);
        }

        function closeTmdb() {
          tmdbModal.classList.remove("open");
          document.body.style.overflow = "";
        }

        function syncTmdbAdminVisibility() {
          if (!openTmdbAdminBtn) return;
          const authed = typeof getPublishPassword === "function" && !!getPublishPassword();
          openTmdbAdminBtn.style.display = authed ? "" : "none";
        }

        function patchTmdbAdminAuthHooks() {
          ["setPublishPassword", "clearPublishPassword"].forEach((name) => {
            if (typeof window[name] !== "function") return;
            if (window[name].__tmdbPatched) return;
            const original = window[name];
            const wrapped = function (...args) {
              const result = original.apply(this, args);
              setTimeout(syncTmdbAdminVisibility, 0);
              return result;
            };
            wrapped.__tmdbPatched = true;
            window[name] = wrapped;
          });
        }

        async function doTmdbSearch() {
          const q = ((tmdbSearchInput && tmdbSearchInput.value) || "").trim();
          if (!q) {
            tmdbGrid.innerHTML = '<div class="tmdb-empty">请输入关键词</div>';
            return;
          }

          tmdbGrid.innerHTML = '<div class="tmdb-loading">搜索中...</div>';
          tmdbPaginationTop.innerHTML = "";
          tmdbPagination.innerHTML = "";

          try {
            const data = await tmdbSearch(q, 1);
            tmdbRawItems = (data.results || []).map((it) => normalizeItem(it, it.media_type));
            tmdbPage = 1;
            renderTmdbGrid();
          } catch (err) {
            tmdbGrid.innerHTML = `<div class="tmdb-error">${esc(String(err.message || err))}</div>`;
            if (typeof showToast === "function") showToast("搜索失败", "error");
          }
        }

        async function handleTmdbAdd(btn) {
          const id = Number(btn.dataset.id);
          const media = btn.dataset.media;
          const kind = btn.dataset.kind;
          const oldText = btn.textContent;

          btn.disabled = true;
          btn.textContent = "处理中...";

          try {
            await tmdbAdd(kind === "watchlist" ? "add_watchlist" : "add_watched", id, media);
            btn.textContent = kind === "watchlist" ? "已加入待看" : "已加入看过";
            if (typeof showToast === "function") {
              showToast(kind === "watchlist" ? "已加入待看" : "已加入看过", "success");
            }
          } catch (err) {
            btn.disabled = false;
            btn.textContent = oldText;
            if (typeof showToast === "function") showToast(String(err.message || err), "error");
          }
        }

        if (tmdbGrid) {
          tmdbGrid.addEventListener("click", (e) => {
            const btn = e.target.closest(".tmdb-admin-btn");
            if (!btn) return;
            e.preventDefault();
            e.stopPropagation();
            handleTmdbAdd(btn);
          });
        }

        openWatchlistBtn && openWatchlistBtn.addEventListener("click", (e) => {
          e.preventDefault();
          openTmdbModal("watchlist");
          if (typeof setActiveMenu === "function") setActiveMenu("openWatchlistBtn");
        });

        openWatchedBtn && openWatchedBtn.addEventListener("click", (e) => {
          e.preventDefault();
          openTmdbModal("watched");
          if (typeof setActiveMenu === "function") setActiveMenu("openWatchedBtn");
        });

        openTmdbAdminBtn && openTmdbAdminBtn.addEventListener("click", (e) => {
          e.preventDefault();
          openTmdbSearchModal();
          if (typeof setActiveMenu === "function") setActiveMenu("openTmdbAdminBtn");
        });

        closeTmdbModal && closeTmdbModal.addEventListener("click", (e) => {
          e.preventDefault();
          closeTmdb();
          if (typeof setActiveMenu === "function") setActiveMenu("homeNavBtn");
        });

        tmdbModal && tmdbModal.addEventListener("click", (e) => {
          if (e.target === tmdbModal) {
			return;
          }
        });

        patchTmdbAdminAuthHooks();
        syncTmdbAdminVisibility();

        tmdbSearchBtn && tmdbSearchBtn.addEventListener("click", doTmdbSearch);
        tmdbSearchInput && tmdbSearchInput.addEventListener("keydown", (e) => {
          if (e.key === "Enter") doTmdbSearch();
          if (e.key === "Escape") closeTmdb();
        });
      })();
    </script>
  </body>
</html>
