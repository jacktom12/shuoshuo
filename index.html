<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
      name="viewport"
    />
    <title>手账</title>
    <link
      href="https://cdn.staticfile.org/lxgw-wenkai-screen-webfont/1.7.0/style.min.css"
      rel="stylesheet"
    />
    <link
      href='data:image/svg+xml,&lt;svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"&gt;&lt;rect x="15" y="20" width="70" height="60" rx="6" fill="%23fff9e6" stroke="%23323232" stroke-width="3"/&gt;&lt;line x1="25" y1="35" x2="75" y2="35" stroke="%23323232" stroke-width="2"/&gt;&lt;line x1="25" y1="45" x2="70" y2="45" stroke="%23323232" stroke-width="2"/&gt;&lt;line x1="25" y1="55" x2="65" y2="55" stroke="%23323232" stroke-width="2"/&gt;&lt;line x1="25" y1="65" x2="75" y2="65" stroke="%23323232" stroke-width="2"/&gt;&lt;path d="M80 15 L85 20 L75 30 L70 25 Z" fill="%23E5AA70" stroke="%23323232" stroke-width="2"/&gt;&lt;/svg&gt;'
      rel="icon"
    />
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
            :root {
              --safe-top: env(safe-area-inset-top, 0px);
              --safe-bottom: env(safe-area-inset-bottom, 0px);
              --safe-left: env(safe-area-inset-left, 0px);
              --safe-right: env(safe-area-inset-right, 0px);


              --ink: #323232;
              --bg: #f3e9dd;
              --paper: #fff9e6;
              --text: #323232;
              --accent: #e5aa70;
              --accent-dark: #d4924f;
              --border: #323232;
              --gold-glow: rgba(229, 170, 112, 0.4);
              --secondary-text: #666666;

              --img-brightness: 1;
              --dot-normal: #cccccc;
              --dot-active: #e5aa70;
              --lightbox-bg: rgba(243, 233, 221, 0.98);
              --lightbox-btn-bg: #fff9e6;
              --lightbox-btn-color: #323232;
              --lightbox-shadow: 3px 3px 0px #323232;

              
              --p-skew: rotate(-0.5deg) skewX(-1deg);
              --p-skew-anti: skewX(1deg) rotate(0.5deg);
              --p-shadow: 4px 4px 0px #323232;

             
              --sketch-radius-1: 8px 24px 8px 24px / 24px 8px 24px 8px;
              --sketch-radius-2: 24px 8px 24px 8px / 8px 24px 8px 24px;
              --sketch-radius-btn: 16px 5px 16px 5px / 5px 16px 5px 16px;
            }

            /* 暗黑模式适配 - 保持P5反色涂鸦质感 */
            body.dark {
              --bg: #1a1917;
              --paper: #2d2a26;
              --text: #f3e9dd;
              --ink: #f3e9dd;
              --accent: #daa06d;
              --accent-dark: #e5aa70;
              --border: #f3e9dd;
              --gold-glow: rgba(218, 160, 109, 0.25);
              --secondary-text: #a0988e;
              --img-brightness: 0.85;
              --dot-normal: #4a453f;
              --dot-active: #daa06d;
              --lightbox-bg: rgba(26, 25, 23, 0.99);
              --lightbox-btn-bg: #2d2a26;
              --lightbox-btn-color: #f3e9dd;
              --lightbox-shadow: 3px 3px 0px #f3e9dd;
              --p-shadow: 4px 4px 0px #f3e9dd;
            }

            body.dark .post:hover {
              box-shadow:
                0 0 18px rgba(218, 160, 109, 0.25),
                0 0 36px rgba(218, 160, 109, 0.12);
            }

            * {
              box-sizing: border-box;
            }
            html,
            body {
              height: 100%;
               overflow-y: hidden; 
      	overflow-x: hidden; /* 👉 关键1：强制禁止整个网页水平溢出 */
              height: 100dvh;
            }

            body {
            margin: 0;
              background-color: var(--bg);
              background-image: url('https://images.weserv.nl/?url=https://raw.githubusercontent.com/jacktom12/blogpic3/main/wallpaperlight.png');

              /* 电脑端策略：固定背景，保持图案比例并自适应屏幕高度，横向空白 */
              background-size: auto 100vh; /* 高度撑满屏幕，宽度等比例缩放 */
              background-repeat: repeat-x; /* 因为高度已经满了，只需要在横向（x轴）重复平铺 */
              background-attachment: fixed; /* 滚动时背景固定不动，类似桌布效果 */
              background-position: center top; /* 居中对齐 */
              color: var(--text);
              font-family: "LXGW WenKai Screen", sans-serif;
              display: flex;
              justify-content: center;
                overflow: hidden;
              height: 100vh;
              height: 100dvh;
              -webkit-font-smoothing: antialiased;
            }
      body.dark {
              background-color: var(--bg);
              background-image: url('https://images.weserv.nl/?url=https://raw.githubusercontent.com/jacktom12/blogpic3/main/wallpaperdark.png');
            }
            .app-container {
              width: 100%;
              max-width: 660px;
              height: 100vh;
              height: 100dvh;
              overflow-y: auto;
              background: transparent; /* 改为透明，让 body 的壁纸透出来 */
               overflow-x: hidden;
              position: relative;
               display: flex;
              flex-direction: column;
              overflow: hidden; /* 这里关掉滚动！ */
              padding-bottom: 0; /* 去掉之前的 padding */
            }

            /* 顶部导航条改造 */
            .topbar {

              z-index: 20;
               padding-top: calc(var(--safe-top) + 5px);
              padding-bottom: 16px;
               /* 防止导航栏被压缩 */
              flex-shrink: 0;
            }

      		.topbar {
        padding-bottom: 4px;
      }

      main {
        padding-top: 0;
      }

      #postsContainer {
        position: relative;
        padding-top: 6px;
      }

      /* 导航下方的“打印出口” */
      #postsContainer::before {
        content: "";
        position: absolute;
        top: -10px;
        left: 50%;
        transform: translateX(-50%);
        width: min(92%, 760px);
        height: 30px;
        background:
          repeating-linear-gradient(
            to bottom,
            rgba(50, 50, 50, 0.06) 0px,
            rgba(50, 50, 50, 0.06) 2px,
            transparent 2px,
            transparent 8px
          ),
          linear-gradient(180deg, rgba(255,249,230,0.96), rgba(243,233,221,0.98));
        border-left: 2px solid var(--border);
        border-right: 2px solid var(--border);
        box-shadow: inset 0 6px 10px rgba(0,0,0,0.06);
        z-index: 0;
        pointer-events: none;
      }

      /* 让第一张像刚“打印”出来 */
      #postsContainer.is-first-page > .post:first-child {
        position: relative;
        margin-top: 0;
        z-index: 1;
      }

      #postsContainer.is-first-page > .post:first-child::before {
        content: "";
        position: absolute;
        top: -18px;
        left: 24px;
        right: 24px;
        height: 18px;
        background:
          repeating-linear-gradient(
            to right,
            transparent 0 10px,
            rgba(50,50,50,0.10) 10px 12px
          ),
          linear-gradient(180deg, rgba(255,249,230,0.95), rgba(255,249,230,0.65));
        border-top: 2px solid rgba(50,50,50,0.22);
        border-radius: 8px 8px 0 0;
        z-index: -1;
        pointer-events: none;
      }

      body.dark #postsContainer::before {
        background:
          repeating-linear-gradient(
            to bottom,
            rgba(243, 233, 221, 0.06) 0px,
            rgba(243, 233, 221, 0.06) 2px,
            transparent 2px,
            transparent 8px
          ),
          linear-gradient(180deg, rgba(45,42,38,0.96), rgba(26,25,23,0.98));
        border-left: 2px solid var(--border);
        border-right: 2px solid var(--border);
        box-shadow: inset 0 6px 10px rgba(255,255,255,0.03);
      }

      body.dark #postsContainer.is-first-page > .post:first-child::before {
        display: none !important;
      }

      @media (max-width: 768px) {
        .topbar {
          padding-bottom: 2px;
        }

        #postsContainer {
          padding-top: 4px;
        }

        #postsContainer::before {
          top: -8px;
          width: calc(100% - 16px);
          height: 22px;
        }

        #postsContainer.is-first-page > .post:first-child::before {
          top: -14px;
          left: 12px;
          right: 12px;
          height: 14px;
          border-radius: 6px 6px 0 0;
        }
      }
      		@media (max-width: 480px) {
        #postsContainer::before {
          height: 18px;
          top: -6px;
        }

        #postsContainer.is-first-page > .post:first-child::before {
          top: -11px;
          left: 10px;
          right: 10px;
          height: 11px;
        }
      }


            .topbar-inner {
                position: relative;
              display: flex;
              align-items: center;
              justify-content: space-between;
              gap: 14px;
              padding: 14px 20px;

              /* 核心修改：变成独立的手绘长方形卡片 */
              margin: 0 16px; /* 让卡片和屏幕边缘有空隙 */
              background: var(--paper); /* 使用纸张背景色 */
              border: 2px solid var(--border); /* 加上手绘边框 */
              border-radius: var(--sketch-radius-btn); /* 使用你已有的手绘圆角变量 */
              box-shadow: var(--p-shadow); /* 使用你已有的卡片阴影变量 */

              /* 稍微加一点倾斜，更有手作感 */
              transform: rotate(-0.5deg) skewX(-1deg);
              transition: transform 0.25s ease, box-shadow 0.25s ease;
            }
            /* 让整个圈框 hover 时也有呼吸感 */
            .topbar-inner:hover {
              transform: rotate(0deg) skewX(0deg) translate(-2px, -2px);
               box-shadow: 6px 6px 0px var(--border);
            }
      /* 针对暗黑模式修正投影颜色 */
            body.dark .topbar-inner {
               box-shadow: 4px 5px 0px rgba(255,255,255,0.05);
            }
             .blog-brand {
              color: var(--ink) !important;
              background: var(--accent);
              padding: 6px 18px;
              font-weight: 900;
              font-size: 1.45rem;
              letter-spacing: 1px;
              text-transform: uppercase;
              /* 增加手绘标签的样式 */
              border: 2px solid var(--border);
              border-radius: var(--sketch-radius-btn);
              box-shadow: 3px 3px 0px var(--border);
              transform: rotate(-3deg) skewX(-4deg);
              cursor: pointer;
              text-shadow: 1px 1px 0px rgba(0, 0, 0, 0.1);
              /* 使用 cubic-bezier 让过渡极其顺滑 */
              transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease, background 0.2s ease;
            }

            /* 去掉原来廉价的 wiggle，换成弹性的放大倾斜 */
            .blog-brand:hover {
              /* 取消了原本的 animation: doodle-wiggle */
              background: var(--accent-dark);
              transform: rotate(2deg) scale(1.1) translateY(-2px);
              box-shadow: 5px 6px 0px var(--border);
            }

            .blog-brand:active {
              transform: rotate(-1deg) scale(0.95) translateY(2px);
              box-shadow: 0px 0px 0px var(--border);
              transition: all 0.1s ease;
            }

            .topbar-right {
              display: flex;
              align-items: center;
              gap: 12px;
              min-width: 0;
            }

            /* 导航小图标按钮 */
            .topbar-icon {
              background: var(--paper);
              border: 2px solid var(--border);
              font-size: 1.1rem;
              cursor: pointer;
              color: var(--text);
              padding: 6px 10px;
              transform: rotate(2deg) skewX(-4deg);
              border-radius: var(--sketch-radius-btn);
              box-shadow: 3px 3px 0px var(--border);
              display: flex;
              align-items: center;
              justify-content: center;
              transition: all 0.15s ease;
            }
            .topbar-icon > * {
              transform: skewX(4deg) rotate(-2deg);
            }
            .topbar-icon:hover {
              background: var(--accent);
              transform: rotate(0deg) scale(1.05) translateY(-2px);
              box-shadow: 4px 4px 0px var(--border);
            }
            .topbar-icon:active {
              transform: translate(2px, 2px);
              box-shadow: 0px 0px 0px var(--border);
            }

            /* 发布按钮大胶囊 */

            main {
              padding: 0 16px;
               /* 让 main 撑满剩下的所有屏幕高度 */
              flex: 1;
              /* 核心修改：让 main 成为独立滚动区域！ */
              overflow-y: auto;

              /* 把原属于 .app-container 的滚动条样式移到这里 */
              scrollbar-width: thin;
              scrollbar-color: var(--border) transparent; /* 滚动条轨道变透明 */

              /* 底部留出安全区和一点空隙 */
              padding-bottom: calc(60px + var(--safe-bottom));

              /* 这个就是你要的“凭空消失的间距”！ */
              /* 通过 mask-image 让顶部产生渐变透明效果，看起来像是融化消失了（可选，非常惊艳） */
               mask-image: linear-gradient(to bottom, transparent, black 16px);
               -webkit-mask-image: linear-gradient(to bottom, transparent, black 16px);
            }
            #postsContainer {
              padding-top: 16px;
            }

            /* ==========================================
         METAPHOR CARD V3 - 核心不规则涂鸦卡片
         ========================================== */
            .post {
              margin: 28px 0;
              padding: 24px;
              background: var(--paper);
              border: 2px solid var(--border);
              border-radius: var(--sketch-radius-1);
              transform: var(--p-skew);
              display: flex;
              flex-direction: column;
              position: relative;
              overflow: visible;
              box-shadow: var(--p-shadow);
              transition:
                transform 0.22s cubic-bezier(0.175, 0.885, 0.32, 1.275),
                box-shadow 0.22s ease,
                border-color 0.22s ease;
              /* 登录页同款米白信纸暗纹线效果 */
              background-image: repeating-linear-gradient(
                transparent,
                transparent 28px,
                rgba(0, 0, 0, 0.03) 28px,
                rgba(0, 0, 0, 0.05) 30px
              );
            }

      /* ===== 置顶卡片 ===== */

      /* ===== 标题 H1~H4 ===== */
      .post-content h1,
      .post-content h2,
      .post-content h3,
      .post-content h4 {
        font-family: 'LXGW WenKai Screen', sans-serif;
        font-weight: 900;
        margin: 20px 0 12px;
        line-height: 1.4;
        position: relative;
        display: inline-block;
      }

      .post-content h1 {
        font-size: 1.5rem;
        color: var(--ink);
        background: var(--accent);
        padding: 4px 16px;
        border: 2px solid var(--border);
        border-radius: var(--sketch-radius-btn);
        box-shadow: 3px 3px 0px var(--border);
        transform: rotate(-1deg) skewX(-3deg);
      }

      .post-content h2 {
        font-size: 1.3rem;
        color: var(--accent-dark);
        padding-bottom: 4px;
        border-bottom: 3px solid var(--accent);
        transform: rotate(-0.3deg);
      }

      .post-content h2::after {
        content: '';
        position: absolute;
        left: 0;
        bottom: -4px;
        width: 40%;
        height: 3px;
        background: repeating-linear-gradient(90deg, var(--accent-dark), var(--accent-dark) 4px, transparent 4px, transparent 8px);
      }

      .post-content h3 {
        font-size: 1.12rem;
        color: var(--text);
        padding-left: 14px;
        border-left: 4px solid var(--accent);
        transform: skewX(-1deg);
      }

      .post-content h4 {
        font-size: 1rem;
        color: var(--secondary-text);
        text-decoration: underline wavy var(--accent) 2px;
        text-underline-offset: 4px;
      }

      body.dark .post-content h1 {
        box-shadow: 3px 3px 0px var(--border);
      }
      body.dark .post-content h2 {
        border-bottom-color: var(--accent-dark);
      }
      body.dark .post-content h2::after {
        background: repeating-linear-gradient(90deg, var(--accent), var(--accent) 4px, transparent 4px, transparent 8px);
      }

      @media (max-width: 768px) {
        .post-content h1 { font-size: 1.25rem; padding: 3px 12px; }
        .post-content h2 { font-size: 1.12rem; }
        .post-content h3 { font-size: 1.02rem; }
      }
      /* ===== 无序 / 有序列表(非checkbox) ===== */
      .post-content ul > li:not(:has(input[type="checkbox"])),
      .post-content ol > li {
        position: relative;
        padding-left: 26px;
      }

      .post-content ul > li:not(:has(input[type="checkbox"]))::before {
        content: '';
        position: absolute;
        left: 2px;
        top: 0.65em;
        width: 9px;
        height: 9px;
        background: var(--accent);
        border: 2px solid var(--border);
        border-radius: var(--sketch-radius-btn);
        transform: rotate(-8deg) skewX(-4deg);
      }

      .post-content ol {
        counter-reset: sketch-ol;
      }

      .post-content ol > li::before {
        counter-increment: sketch-ol;
        content: counter(sketch-ol);
        position: absolute;
        left: 0;
        top: -1px;
        min-width: 18px;
        height: 18px;
        padding: 0 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--accent);
        color: var(--ink);
        font-size: 0.72rem;
        font-weight: 900;
        border: 2px solid var(--border);
        border-radius: var(--sketch-radius-btn);
        box-shadow: 1.5px 1.5px 0px var(--border);
        transform: rotate(-4deg) skewX(-4deg);
      }

      .post-content ul > li:nth-child(even)::before,
      .post-content ol > li:nth-child(even)::before {
        transform: rotate(6deg) skewX(3deg);
      }

      body.dark .post-content ul > li::before,
      body.dark .post-content ol > li::before {
        box-shadow: 1.5px 1.5px 0px var(--border);
      }


          .post.pinned {
        position: relative;
        margin-top: 26px;
        padding-top: 24px;
        border-color: var(--pinned-border, var(--accent-dark)) !important;
        background-color: transparent !important;
        background-image: none !important;
        animation: none;
        clip-path: none;
        box-shadow:
          0 16px 30px rgba(53, 29, 17, 0.18),
          0 8px 0 rgba(35, 27, 22, 0.16),
          0 0 0 1px rgba(255,255,255,0.26) inset !important;
      }

      .post.pinned::before,
      .post.pinned:hover::before {
        content: "" !important;
        position: absolute !important;
        inset: 0 !important;
        z-index: 0 !important;
        opacity: 1 !important;
        display: block !important;
        pointer-events: none !important;
        border-radius: inherit !important;
        background: var(--pinned-gradient, #ffd36f) !important;
        background-repeat: no-repeat !important;
        background-size: cover !important;
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.22) !important;
        transform: none !important;
      }

      body.dark .post.pinned {
        border-color: var(--pinned-border-dark, #f0c36d) !important;
        box-shadow:
          0 18px 34px rgba(0, 0, 0, 0.44),
          0 8px 0 rgba(0, 0, 0, 0.30),
          0 0 0 1px rgba(255,255,255,0.06) inset !important;
      }

      body.dark .post.pinned::before,
      body.dark .post.pinned:hover::before {
        background: var(--pinned-gradient-dark, var(--pinned-gradient, #7a4d16)) !important;
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08) !important;
      }

      .post.pinned > * {
        position: relative;
        z-index: 1;
      }

      .post.pinned .post-time {
        background: rgba(255,255,255,0.78) !important;
        color: #2b2017 !important;
      }

      body.dark .post.pinned .post-time {
        background: rgba(22,18,18,0.34) !important;
        color: #fff4dc !important;
        border-color: rgba(255,238,199,0.52) !important;
      }

      .post.pinned,
      .post.pinned:hover {
        transform: none !important;
        border-color: var(--pinned-border, var(--accent-dark)) !important;
      }

      body.dark .post.pinned,
      body.dark .post.pinned:hover {
        border-color: var(--pinned-border-dark, #f0c36d) !important;
      }

      .post.pinned::after,
      .post.pinned:hover::after {
        opacity: 0 !important;
        display: none !important;
      }

      .pin-badge {
        position: absolute;
        top: 0;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 8;
        pointer-events: none;
        width: auto;
        height: auto;
        filter: none;
        animation: none;
      }

      .pin-badge-text {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 4px 10px;
        white-space: nowrap;
        color: var(--text);
        background: var(--paper);
        border: 2px solid var(--border);
        border-radius: 999px;
        box-shadow: 3px 3px 0 var(--border);
        font-size: 12px;
        line-height: 1;
        font-weight: 900;
      }

      .pin-badge-text svg {
        width: 16px;
        height: 16px;
        flex: 0 0 16px;
        display: block;
        color: var(--accent-dark);
      }

      body.dark .pin-badge-text svg {
        color: var(--accent);
      }

      .post.pinned .post-header {
        margin-top: 0;
      }

      @media (max-width: 768px) {
        .post.pinned {
          margin-top: 22px;
          padding-top: 20px;
        }

        .pin-badge-text {
          gap: 5px;
          padding: 3px 8px;
          font-size: 11px;
        }

        .pin-badge-text svg {
          width: 15px;
          height: 15px;
          flex-basis: 15px;
        }
      }



            .post:nth-child(even) {
              border-radius: var(--sketch-radius-2);
              transform: rotate(0.6deg) skewX(0.5deg);
            }

            /* 底层趣味手绘阴影效果 */
            .post::before {
              content: "";
              position: absolute;
              inset: 0;
              pointer-events: none;
              opacity: 0;
              z-index: -1;
         box-shadow: 0 0 0 2px transparent, 8px 8px 0px var(--gold-glow);
              transition:

    <script>
      // 全局函数：点击“查看”后关闭搜索，定位到指定手账
        function viewPost(id) {
  // 1. 关闭搜索框
  closeSearchModalFunc();

  const post = allPosts.find((p) => p.id === id);
  if (!post) {
    showToast("未找到该手账", "error");
    return;
  }

  // 2. 快速路径：卡片已在 DOM 中
  const existingEl = document.getElementById(`post-${id}`);
  if (existingEl) {
    scrollToPostWithRetry(id, "center", 10);
    return;
  }

  // 3. 计算目标卡片在排序列表中的索引
  // 关键修复：必须用 getOrderedGroups() 处理后的 rest 列表来计算索引，
  // 因为 render() 实际分页用的就是 rest（已剔除置顶手账和音乐歌单卡片），
  // 如果这里用 allPosts 全量排序计算，遇到置顶/歌单卡片穿插时会导致页码算错，
  // 从而跳转到错误的页面，定位失败、甚至误将别的卡片当作目标高亮。
  const sorted = sortPostsByDateDesc([...allPosts]);
  filtered = sorted;
  const { rest } = getOrderedGroups(filtered);
  const index = rest.findIndex((p) => p.id === id);
  if (index === -1) {
    showToast("数据异常，未找到该手账", "error");
    return;
  }

  // 4. 计算目标页码（从 1 开始），与 render() 的分页逻辑保持一致
  const targetPage = Math.floor(index / perPage) + 1;

  // 5. 一次性渲染到目标页
  page = targetPage;
  render(true);

  // 6. 启动重试定位（分页后目标必定在当前页内，重试次数可大幅减少）
  let attempts = 0;
  const maxAttempts = 15;      // 尝试 15 次即可
  const interval = 120;        // 每次间隔 120ms，总时长约 1.8 秒

  const tryLocate = () => {
    attempts++;
    // 强制同步重排，让浏览器计算最新布局
    void postsContainer?.offsetHeight;

    requestAnimationFrame(() => {
      const el = document.getElementById(`post-${id}`);
      if (el) {
        const sc = getScrollContainer();
        if (sc) {
          // 用 getBoundingClientRect 计算精确滚动位置
          const containerRect = sc.getBoundingClientRect();
          const elRect = el.getBoundingClientRect();
          const targetOffset =
            sc.scrollTop + elRect.top - containerRect.top -
            (sc.clientHeight - elRect.height) / 2;
          sc.scrollTo({ top: Math.max(0, targetOffset), behavior: "smooth" });

          // 等待滚动动画完成（约 600ms）后再添加高亮
          setTimeout(() => {
            el.classList.add("post-flash-focus");
            // 高亮持续 2.6 秒，略长于动画时长

      } else {

        const diffMin = Math.floor(diffMs / 60000);

        if (diffDay < 3) {

        const started = performance.now();
        if (masonrySettleTimer) clearInterval(masonrySettleTimer);
        scheduleMasonry();
        masonrySettleTimer = setInterval(() => {

      function layoutMasonry() {
        const container = document.getElementById("postsContainer");
        if (!container) return;
        const items = Array.from(container.querySelectorAll(".post"));
        if (!items.length) {
          container.style.height = "0px";
          container.classList.remove("masonry-ready");
          return;
        }

        const styles = getComputedStyle(container);
        const paddingLeft = parseFloat(styles.paddingLeft) || 0;
        const paddingRight = parseFloat(styles.paddingRight) || 0;
        const innerWidth = container.clientWidth - paddingLeft - paddingRight;
        const columns = Math.max(1, getMasonryColumnCount());
        const gap = getMasonryGap();
        const itemWidth = Math.max(
          0,
          (innerWidth - gap * (columns - 1)) / columns,
        );
        const heights = new Array(columns).fill(0);

        container.style.setProperty("--masonry-item-width", `${itemWidth}px`);

        items.forEach((item, index) => {
          item.style.width = `${itemWidth}px`;

          let columnIndex = 0;
          if (index < columns) {
            columnIndex = index;
          } else {
            let minHeight = heights[0];
            for (let i = 1; i < heights.length; i++) {
              if (heights[i] < minHeight) {
                minHeight = heights[i];
                columnIndex = i;
              }
            }
          }

          const x = columnIndex * (itemWidth + gap);
          const y = heights[columnIndex];
          const containerStyles = getComputedStyle(container);
          const extraGap = item.classList.contains("pinned")
            ? parseFloat(
                containerStyles.getPropertyValue("--pinned-extra-gap"),
              ) || 0
            : index === 0
              ? parseFloat(
                  containerStyles.getPropertyValue("--first-card-extra-gap"),
                ) || 0
              : 0;
          item.style.left = `${x}px`;
          item.style.top = `${y}px`;
          heights[columnIndex] += item.offsetHeight + gap + extraGap;
        });

        container.style.height = `${Math.max(...heights) - gap}px`;
        container.classList.add("masonry-ready");
      }

      function parseMdToPosts(mdContent, fileYear) {
        const fi = mdContent.indexOf("---", 3);
        const raw = fi > -1 ? mdContent.slice(fi + 3).trim() : mdContent.trim();
        return raw
          .split(/\n\n+/)
          .filter((s) => s.trim())
          .map((item, idx) => {
            let text = item.trim();
            let date = "";
            let images = [];
            const imgR = /!\[.*?\]\((https?:\/\/.+?)\)/g;
            const imgM = [...text.matchAll(imgR)];
            if (imgM.length) {
              images = imgM.map((m) => m[1]);
              text = text.replace(imgR, "");
            }
            const dm = text.match(/@(\d{4}-\d{2}-\d{2}\s+\d{2}(?::|::)\d{2})/);
            if (dm) {
              date = dm[1].replace(/::/g, ":");
              text = text.replace(dm[0], "").trim();
            } else {
              date = fileYear + "-01-01 00:00";
            }
            if (text || images.length) {
              return {
                id:
                  fileYear +
                  "_" +
                  idx +
                  "_" +
                  Math.random().toString(36).slice(2, 5),
                date,
                content: [text],
                images,
              };
            }
            return null;
          })
          .filter(Boolean);

        const anchor =

              el.offsetTop < scBottom - 16,

        return {
          id: anchor.id.replace(/^post-/, ""),
          offset: anchor.offsetTop - scTop,
          scrollTop: scTop,
        };

      function restoreViewportAnchor(anchor, attempts = 8) {
        const sc = getScrollContainer();
        if (!sc || !anchor) return;
        let count = 0;
        const tick = () => {

          const el = anchor.id
            ? document.getElementById(`post-${anchor.id}`)
            : null;
          if (el) {
            sc.scrollTop = Math.max(0, el.offsetTop - anchor.offset);
          } else if (typeof anchor.scrollTop === "number") {
            sc.scrollTop = Math.max(0, anchor.scrollTop);
          }
          count += 1;
          if (count < attempts)
            setTimeout(() => requestAnimationFrame(tick), 90);

        requestAnimationFrame(tick);

      // ---------- 数据加载 ----------
      async function init() {
        if (isLoading) return;
        isLoading = true;
        loaderDom.style.display = "block";
        loaderDom.textContent = "正在加载手账...";
        const isLocalPreview = isLocalPreviewMode();
        try {
          if (isLocalPreview) {
            allPosts = getMockPosts();
          } else {
            const res = await fetch(`${WORKER_URL}/api/get-memos`, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({ publishPassword: getPublishPassword() || "" })
            });
            if (!res.ok) throw new Error("网络响应错误");
            const json = await res.json();
            if (json.code === 200) {
              allPosts = json.data || [];
              if (!allPosts.length) allPosts = getMockPosts();
            } else {
              throw new Error(json.msg || "获取数据失败");
            }
          }
        } catch (err) {
          console.error(err);
          allPosts = getMockPosts();
          showToast("在线数据不可用，已切换为本地演示数据", "error");
        }

        allPosts = sortPostsByDateDesc(allPosts);
        filtered = sortPostsByDateDesc(allPosts);
        page = 1;
        loaderDom.style.display = "none";
        isLoading = false;
        render(true);
        setupLightbox();
      }

      function buildMemoPaginationHTML(totalItems) {
        const totalPages = Math.max(1, Math.ceil(totalItems / perPage));
        if (totalPages <= 1) return "";
        const cur = page;
        const pages = [];
        pages.push(1);
        if (cur > 3) pages.push("...");
        for (
          let p = Math.max(2, cur - 1);
          p <= Math.min(totalPages - 1, cur + 1);
          p++
        ) {
          pages.push(p);
        }
        if (cur < totalPages - 2) pages.push("...");
        if (totalPages > 1) pages.push(totalPages);
        const seen = new Set();
        const dedup = pages.filter((p) => {
          if (p !== "..." && seen.has(p)) return false;
          if (p !== "...") seen.add(p);
          return true;
        });
        const btns = dedup
          .map((p) => {
            if (p === "...") {
              return '<span class="tmdb-page-ellipsis">...</span>';
            }
            return `<button class="tmdb-page-btn${
              p === cur ? " active" : ""
            }" onclick="goToMemoPage(${p})">${p}</button>`;
          })
          .join("");
        const prevDisabled = cur <= 1 ? "disabled" : "";
        const nextDisabled = cur >= totalPages ? "disabled" : "";
        return `<div class="tmdb-pagination" id="memoPagination">
          <button class="tmdb-page-btn" ${prevDisabled} onclick="goToMemoPage(${
          cur - 1
        })">‹</button>
          ${btns}
          <button class="tmdb-page-btn" ${nextDisabled} onclick="goToMemoPage(${
          cur + 1
        })">›</button>
        </div>`;
      }

      function goToMemoPage(p) {
  const { rest } = getOrderedGroups(filtered);
  const totalPages = Math.max(1, Math.ceil(rest.length / perPage));
  const target = Math.min(Math.max(1, p), totalPages);
  if (target === page) return;
  page = target;

  // 先渲染（重建DOM + 触发瀑布流重排）
  render(true);

  const sc = getScrollContainer();
  if (!sc) return;

  // 判断是否为移动设备（手机 / 平板触屏设备）
  const isMobile = window.innerWidth <= 768 || ('ontouchstart' in window);

  // 移动端延迟更长，给瀑布流布局充分稳定时间
  const delay = isMobile ? 480 : 120;

  // 滚动执行函数（带重试修正）
  const scrollToTop = () => {
    // 先用平滑滚动到顶部
    sc.scrollTo({ top: 0, behavior: "smooth" });

    // 手机端额外做一次“强制修正”，防止被后续布局变化冲走
    if (isMobile) {
      let retries = 0;
      const maxRetries = 6;
      const checkAndFix = () => {
        // 如果滚动位置偏离顶部超过 10px，强制瞬间拉回
        if (sc.scrollTop > 10 && retries < maxRetries) {
          sc.scrollTo({ top: 0, behavior: "auto" });
          retries++;
          // 每 160ms 检查一次，直到稳定
          setTimeout(checkAndFix, 160);
        }
      };
      // 首次检查延迟 280ms，让平滑滚动先完成一部分
      setTimeout(checkAndFix, 280);
    }
  };

  // 在下一帧 + 延迟后执行滚动，确保 DOM 更新和初次布局已完成
  requestAnimationFrame(() => {
    setTimeout(scrollToTop, delay);
  });
}

      function render(reset = false) {
        if (!postsContainer) return;
        const pinnedHero = ensurePinnedHeroContainer();
        if (pinnedHero) pinnedHero.innerHTML = "";
        postsContainer.classList.remove("masonry-ready");
        const { pinned, rest } = getOrderedGroups(filtered);
        const totalPages = Math.max(1, Math.ceil(rest.length / perPage));
        if (page > totalPages) page = totalPages;
        if (page < 1) page = 1;
        // 只在第一页时挂上这个类，避免每页第一条卡片都出现“撕纸装订”装饰条
        postsContainer.classList.toggle("is-first-page", page === 1);
        const start = (page - 1) * perPage;
        const end = page * perPage;
        const show = rest.slice(start, end);
        const html =
          page === 1
            ? [
                ...pinned.map(buildPinnedHeroHTML),
                ...show.map(buildPostHTML),
              ].join("")
            : show.map(buildPostHTML).join("");
        if (!html) {
          postsContainer.innerHTML =
            '<div style="text-align:center;color:var(--secondary-text);padding:40px;font-weight:900;">暂无数据</div>';
        } else {
          postsContainer.innerHTML = html;
        }
        let pagWrap = document.getElementById("memoPaginationWrap");
        if (!pagWrap) {
          pagWrap = document.createElement("div");
          pagWrap.id = "memoPaginationWrap";
          postsContainer.parentNode.insertBefore(
            pagWrap,
            postsContainer.nextSibling
          );
        }
        pagWrap.innerHTML = buildMemoPaginationHTML(rest.length);
        bindImagesInContainer(postsContainer);
        if (window.__scrapbookPreview) {
          window.__scrapbookPreview.bindScrapbookPreviewClicks(postsContainer);
        }
        if (window.HWPlayer) window.HWPlayer.mountAll(postsContainer);
        requestAnimationFrame(() => {
          startMasonrySettle();
          const imgNodes = Array.from(postsContainer.querySelectorAll("img"));
          imgNodes.forEach((img) => {
            if (img.dataset.masonryBound) return;
            img.dataset.masonryBound = "true";
            if (!img.complete) {
              img.addEventListener("load", startMasonrySettle, {
                passive: true,
              });
              img.addEventListener("error", startMasonrySettle, {
                passive: true,
              });
            }
          });
        });
      }

      // setupInfiniteScroll 已移除：改为分页控件跳转

      // ---------- 图片轮播 + 灯箱绑定 ----------
      let globalGalleryLock = false;
      function bindImagesInContainer(container) {
        container.querySelectorAll(".post-images").forEach((wrap) => {
          if (wrap.dataset.boundDrag) return;
          wrap.dataset.boundDrag = "true";
          const slide = wrap.querySelector(".img-slide");
          const dotsBox = wrap.querySelector(".img-dots");
          const imgs = slide.querySelectorAll("img");
          const total = imgs.length;
          if (total <= 1) {
            if (dotsBox) dotsBox.style.display = "none";
            wrap.classList.add("single-image");
          } else {
            if (dotsBox) {
              dotsBox.innerHTML = "";
              for (let i = 0; i < total; i++) {
                const dot = document.createElement("span");
                dot.className = i === 0 ? "dot active" : "dot";
                dotsBox.appendChild(dot);
              }
            }
            const dots = dotsBox ? dotsBox.querySelectorAll(".dot") : [];
            let sX = 0,
              sY = 0,
              isScrolling = null,
              cur = 0,
              isDrag = false,
              moved = 0,
              prevTrans = 0,
              curTrans = 0,
              animId = 0;
            function setPos() {
              slide.style.transform = `translateX(${curTrans}px)`;
            }
            function anim() {
              if (!isDrag) return;
              setPos();
              animId = requestAnimationFrame(anim);
            }
            function stopAnim() {
              if (animId) {
                cancelAnimationFrame(animId);
                animId = 0;
              }
            }
            function gx(e) {
              return e.type.includes("mouse") ? e.pageX : e.touches[0].clientX;
            }
            function gy(e) {
              return e.type.includes("mouse") ? e.pageY : e.touches[0].clientY;
            }
            function updateDots() {
              dots.forEach((d) => d.classList.remove("active"));
              if (dots[cur]) dots[cur].classList.add("active");
            }
            function goTo(idx, animate = true) {
              cur = Math.max(0, Math.min(total - 1, idx));
              curTrans = -imgs[cur].offsetLeft;
              prevTrans = curTrans;
              slide.style.transition = animate
                ? "transform 0.15s cubic-bezier(0.25,1,0.5,1)"
                : "none";
              setPos();
              updateDots();
            }
            function forceStop() {
              isDrag = false;
              isScrolling = null;
              moved = 0;
              wrap.classList.remove("dragging");
              stopAnim();
              curTrans = prevTrans;
              setPos();
            }
            function tStart(e) {
              if (e.type === "mousedown" && e.button !== 0) return;
              isDrag = true;
              isScrolling = null;
              moved = 0;
              sX = gx(e);
              sY = gy(e);
              slide.style.transition = "none";
              wrap.classList.add("dragging");
              stopAnim();
              animId = requestAnimationFrame(anim);
            }
            function tMove(e) {
              if (!isDrag) return;
              const dx = gx(e) - sX,
                dy = gy(e) - sY;
              if (isScrolling === null)
                isScrolling = Math.abs(dy) > Math.abs(dx);
              if (isScrolling) {
                forceStop();
                return;
              }
              if (Math.abs(dx) > 5) e.preventDefault();
              moved = dx;
              curTrans = prevTrans + dx;
            }
            function tEnd() {
              if (!isDrag) return;
              isDrag = false;
              isScrolling = null;
              wrap.classList.remove("dragging");
              stopAnim();
              const iw = imgs[0] ? imgs[0].offsetWidth + 8 : wrap.offsetWidth;
              if (Math.abs(moved) > iw * 0.22) {
                const ms = Math.max(1, Math.round(Math.abs(moved) / iw));
                cur =
                  moved < 0
                    ? Math.min(total - 1, cur + ms)
                    : Math.max(0, cur - ms);
              }
              goTo(cur);
              moved = 0;
            }
            wrap.addEventListener("touchstart", tStart, { passive: true });
            wrap.addEventListener("touchmove", tMove, { passive: false });
            wrap.addEventListener("touchend", tEnd);
            wrap.addEventListener("touchcancel", forceStop);
            wrap.addEventListener("mousedown", tStart);
            wrap.addEventListener("mousemove", tMove);
            wrap.addEventListener("mouseup", tEnd);
            wrap.addEventListener("mouseleave", forceStop);
            wrap.addEventListener("dragstart", (e) => e.preventDefault());
            dots.forEach((dot, i) =>
              dot.addEventListener("click", () => goTo(i)),
            );

            const wrapParent = wrap.closest(".post-images-wrap");
            if (wrapParent) {
              const prevBtn = wrapParent.querySelector(".img-nav-prev");
              const nextBtn = wrapParent.querySelector(".img-nav-next");
              function updateNavBtns() {
                if (prevBtn) prevBtn.classList.toggle("hidden", cur <= 0);
                if (nextBtn)
                  nextBtn.classList.toggle("hidden", cur >= total - 1);
              }
              const origGoTo = goTo;
              goTo = function (idx, animate) {
                origGoTo(idx, animate);
                updateNavBtns();
              };
              if (prevBtn)
                prevBtn.addEventListener("click", (e) => {
                  e.stopPropagation();
                  goTo(Math.max(0, cur - 1));
                });
              if (nextBtn)
                nextBtn.addEventListener("click", (e) => {
                  e.stopPropagation();
                  goTo(Math.min(total - 1, cur + 1));
                });
              updateNavBtns();
            }

            goTo(0, false);
          }
        });
        container.querySelectorAll(".post").forEach((post) => {
          const imgs = Array.from(post.querySelectorAll(".post-right img"));
          imgs.forEach((img, idx) => {
            if (img.dataset.boundClick) return;
            img.dataset.boundClick = "true";
            img.onclick = (e) => {
              if (globalGalleryLock) {
                e.preventDefault();
                return;
              }
              currentGallery = imgs.map((i) => i.src);
              currentIndex = idx;
              openLightbox();
            };
          });
        });
      }

      // ---------- 完整灯箱逻辑 ----------
      function applyTransform() {
        if (lbImg)
          lbImg.style.transform = `translate(${translateX}px,${translateY}px) scale(${scale})`;
      }
      function setLightboxImageMotion(x = 0, y = 0, s = 1) {
        if (lbImg)
          lbImg.style.transform = `translate(${x}px,${y}px) scale(${s})`;
      }
      function resetTransform() {
        scale = 1;
        baseScale = 1;
        translateX = 0;
        translateY = 0;
        pointerCache = [];
        if (lbImg) {
          lbImg.style.transition = "none";
          applyTransform();
        }
      }
      function resetLightboxBackdrop() {
        const fallback = document.body.classList.contains("dark")
          ? "26, 25, 23"
          : "243, 233, 221";
        lb.style.setProperty("--lightbox-rgb", fallback);
      }
      function getDominantImageColor(img) {
        const canvas = document.createElement("canvas");
        const size = 56;
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext("2d", { willReadFrequently: true });
        if (!ctx || !img.naturalWidth || !img.naturalHeight) return null;
        ctx.drawImage(img, 0, 0, size, size);
        const data = ctx.getImageData(0, 0, size, size).data;
        const buckets = new Map();
        for (let i = 0; i < data.length; i += 16) {
          const r = data[i],
            g = data[i + 1],
            b = data[i + 2],
            a = data[i + 3];
          if (a < 180) continue;
          const max = Math.max(r, g, b);
          const min = Math.min(r, g, b);
          const saturation = max === 0 ? 0 : (max - min) / max;
          const brightness = (r * 0.299 + g * 0.587 + b * 0.114) / 255;
          if (
            (brightness > 0.96 && saturation < 0.08) ||
            (brightness < 0.06 && saturation < 0.08)
          )
            continue;
          const key = `${Math.round(r / 32)},${Math.round(g / 32)},${Math.round(b / 32)}`;
          const item = buckets.get(key) || {
            count: 0,
            r: 0,
            g: 0,
            b: 0,
            score: 0,
          };
          item.count++;
          item.r += r;
          item.g += g;
          item.b += b;
          item.score += 1 + saturation * 0.8;
          buckets.set(key, item);
        }
        let best = null;
        buckets.forEach((item) => {
          if (!best || item.score > best.score) best = item;
        });
        if (!best) return null;
        return {
          r: Math.round(best.r / best.count),
          g: Math.round(best.g / best.count),
          b: Math.round(best.b / best.count),
        };
      }
      function updateLightboxBackdropFromImage(img, token) {
        try {
          const color = getDominantImageColor(img);
          if (!color || token !== lightboxColorToken) return;
          lb.style.setProperty(
            "--lightbox-rgb",
            `${color.r}, ${color.g}, ${color.b}`,
          );
        } catch (err) {
          if (token === lightboxColorToken) resetLightboxBackdrop();
        }
      }
      function sampleLightboxImageSource(src, token) {
        if (/^https?:\/\//i.test(src)) {
          const sampler = new Image();
          sampler.crossOrigin = "anonymous";
          sampler.onload = () =>
            updateLightboxBackdropFromImage(sampler, token);
          sampler.onerror = () => {
            if (token === lightboxColorToken) resetLightboxBackdrop();
          };
          sampler.src = src;
          return;
        }
        // 如果 src 是 blob: 或 data: 等，直接使用 lbImg 元素
        if (lbImg.complete && lbImg.naturalWidth) {
          updateLightboxBackdropFromImage(lbImg, token);
        }
      }
      function updateLightboxImage(animate = true) {
        if (!lbImg) return;
        document.getElementById("lbPrevBtn").style.display =
          currentIndex > 0 ? "flex" : "none";
        document.getElementById("lbNextBtn").style.display =
          currentIndex < currentGallery.length - 1 ? "flex" : "none";
        lbCounter.textContent =
          currentIndex + 1 + " / " + currentGallery.length;
        const imageSrc = currentGallery[currentIndex];
        const colorToken = ++lightboxColorToken;
        lbImg.onload = () => sampleLightboxImageSource(imageSrc, colorToken);
        lbImg.onerror = () => resetLightboxBackdrop();

        lbImg.removeAttribute("crossorigin");
        if (!animate) {
          lbImg.src = imageSrc;
          resetTransform();
          lbImg.style.opacity = "1";
          if (lbImg.complete && lbImg.naturalWidth)
            sampleLightboxImageSource(imageSrc, colorToken);
          return;
        }
        lbImg.style.transition = "opacity 0.18s ease";
        lbImg.style.opacity = "0";
        setTimeout(() => {
          lbImg.src = imageSrc;
          resetTransform();
          lbImg.style.opacity = "1";
          if (lbImg.complete && lbImg.naturalWidth)
            sampleLightboxImageSource(imageSrc, colorToken);
        }, 160);
      }
      function animateSwitchImage(targetIdx, direction = 1) {
        if (
          lightboxSwitching ||
          targetIdx < 0 ||
          targetIdx >= currentGallery.length ||
          targetIdx === currentIndex
        )
          return;

        scale = 1;
        translateX = 0;
        translateY = 0;

        lightboxSwitching = true;
        const distance = Math.min(window.innerWidth * 0.3, 200);
        const duration = 320;

        // ----- 1. 旧图滑出 -----
        lbImg.style.transition = `transform ${duration}ms cubic-bezier(0.22, 1, 0.36, 1), opacity ${duration}ms ease`;
        lbImg.style.opacity = "0";
        lbImg.style.transform = `translateX(${-direction * distance}px) scale(0.92)`;

        setTimeout(() => {
          currentIndex = targetIdx;
          // 更新按钮和计数
          document.getElementById("lbPrevBtn").style.display =
            currentIndex > 0 ? "flex" : "none";
          document.getElementById("lbNextBtn").style.display =
            currentIndex < currentGallery.length - 1 ? "flex" : "none";
          lbCounter.textContent =
            currentIndex + 1 + " / " + currentGallery.length;

          const imageSrc = currentGallery[currentIndex];

          // 🧠 关键：清除旧 onload，防止冲突
          lbImg.onload = null;
          // 🧠 关键：不重置背景色！保留旧图颜色，让它自然过渡到新色

          // 新图起始位置（从另一侧滑入）
          lbImg.style.transition = "none";
          lbImg.src = imageSrc;
          lbImg.style.opacity = "0";
          lbImg.style.transform = `translateX(${direction * distance}px) scale(0.92)`;
          void lbImg.offsetHeight; // 强制回流

          // 🧠 关键：图片加载完成后，触发颜色提取（此时背景会从旧色平滑渐变到新色）
          lbImg.onload = function () {
            // 增加 token 防止旧回调覆盖新回调
            sampleLightboxImageSource(imageSrc, ++lightboxColorToken);
          };
          // 如果加载失败，保持旧色不做变化，也不会闪
          lbImg.onerror = function () {
            // 什么都不做，保留旧色背景
          };

          // 新图滑入中心
          lbImg.style.transition = `transform ${duration}ms cubic-bezier(0.22, 1, 0.36, 1), opacity ${duration}ms ease`;
          lbImg.style.opacity = "1";
          lbImg.style.transform = `translateX(0px) scale(1)`;

          setTimeout(() => {
            lbImg.style.transition = "";
            lightboxSwitching = false;
          }, duration + 50);
        }, duration + 30);
      }
      function openLightbox() {
        lightboxClosing = false;
        resetTransform();
        resetLightboxBackdrop();
        lb.style.display = "flex";
        lb.style.opacity = "0";
        lb.style.transition = "opacity 0.2s ease, background 0.38s ease";
        requestAnimationFrame(() => {
          lb.style.opacity = "1";
        });
        document.body.style.overflow = "hidden";
        updateLightboxImage(false);
      }
      function closeLightbox(exitDirection = "fade") {
        if (lightboxClosing) return;
        lightboxClosing = true;
        lb.style.transition = "opacity 0.22s ease, background 0.25s ease";
        lb.style.opacity = "0";
        if (exitDirection === "up") {
          lbImg.classList.add("exit-animate");
          lbImg.style.opacity = "0";
          setLightboxImageMotion(0, -90, 0.96);
        }
        setTimeout(() => {
          lb.style.display = "none";
          lb.style.opacity = "";
          lb.style.transition = "";
          lbImg.classList.remove("exit-animate", "switching");
          lbImg.style.opacity = "";
          if (!searchModal.classList.contains("open"))
            document.body.style.overflow = "";
          resetTransform();
          lightboxClosing = false;
        }, 230);
      }
      function showNext() {
        if (scale !== 1 || currentGallery.length <= 1) return;
        if (currentIndex < currentGallery.length - 1) {
          animateSwitchImage(currentIndex + 1, 1);
        }
      }
      function showPrev() {
        if (scale !== 1 || currentGallery.length <= 1) return;
        if (currentIndex > 0) {
          animateSwitchImage(currentIndex - 1, -1);
        }
      }

      function ptDist(p1, p2) {
        return Math.hypot(p1.clientX - p2.clientX, p1.clientY - p2.clientY);
      }
      function updatePtrCache(e) {
        for (let i = 0; i < pointerCache.length; i++) {
          if (pointerCache[i].pointerId === e.pointerId) {
            pointerCache[i] = e;
            break;
          }
        }
      }
      function removePtrCache(e) {
        for (let i = 0; i < pointerCache.length; i++) {
          if (pointerCache[i].pointerId === e.pointerId) {
            pointerCache.splice(i, 1);
            break;
          }
        }
      }

      function setupLightbox() {
        document.getElementById("lbCloseBtn").onclick = closeLightbox;
        document.getElementById("lbPrevBtn").onclick = (e) => {
          e.stopPropagation();
          showPrev();
        };
        document.getElementById("lbNextBtn").onclick = (e) => {
          e.stopPropagation();
          showNext();
        };

        let lbWheelDX = 0,
          lbWheelTimer = null;
        lb.addEventListener(
          "wheel",
          (e) => {
            e.preventDefault();
            const isH = Math.abs(e.deltaX) >= Math.abs(e.deltaY);
            if (scale === 1 && isH && currentGallery.length > 1) {
              lbWheelDX += e.deltaX;
              clearTimeout(lbWheelTimer);
              lbWheelTimer = setTimeout(() => {
                if (Math.abs(lbWheelDX) >= 70) {
                  lbWheelDX > 0 ? showNext() : showPrev();
                }
                lbWheelDX = 0;
              }, 60);
              return;
            }
            const delta = e.deltaY < 0 ? 0.15 : -0.15;
            const oldScale = scale;
            scale = Math.max(1, Math.min(5, scale + delta));
            if (scale > 1) {
              const rect = lbImg.getBoundingClientRect();
              translateX +=
                -(e.clientX - rect.left - rect.width / 2) *
                (scale / oldScale - 1);
              translateY +=
                -(e.clientY - rect.top - rect.height / 2) *
                (scale / oldScale - 1);
            } else {
              translateX = 0;
              translateY = 0;
            }
            lbImg.style.transition = "transform 0.1s ease-out";
            applyTransform();
          },
          { passive: false },
        );

        let dragStartX = 0,
          dragStartY = 0,
          pointerStartX = 0,
          pointerStartY = 0;
        let isDragging = false;
        const SWIPE_TH = 32;

        lbImg.addEventListener("pointerdown", (e) => {
          e.preventDefault();
          lbImg.setPointerCapture?.(e.pointerId);
          pointerCache.push(e);
          lbImg.style.transition = "none";
          isDragging = true;
          if (pointerCache.length === 1) {
            isPointerDown = true;
            pointerStartX = e.clientX;
            pointerStartY = e.clientY;
            dragStartX = e.clientX - translateX;
            dragStartY = e.clientY - translateY;
          } else if (pointerCache.length === 2) {
            isPointerDown = false;
            lastPinchDist = ptDist(pointerCache[0], pointerCache[1]);
            baseScale = scale;
          }
        });
        lbImg.addEventListener("pointermove", (e) => {
          if (!isDragging) return;
          updatePtrCache(e);
          if (pointerCache.length === 1 && isPointerDown) {
            if (scale > 1) {
              translateX = e.clientX - dragStartX;
              translateY = e.clientY - dragStartY;
              applyTransform();
            } else {
              const dx = e.clientX - pointerStartX;
              const dy = e.clientY - pointerStartY;
              if (Math.abs(dy) > Math.abs(dx) && dy < 0) {
                const op = Math.max(0.15, 1 - Math.abs(dy) / 280);
                lb.style.opacity = op;
                lb.style.transition = "none";
                lbImg.classList.add("exit-animate");
                lbImg.style.opacity = Math.max(0.35, op);
                setLightboxImageMotion(
                  0,
                  dy * 0.42,
                  1 - Math.min(Math.abs(dy) / 1200, 0.06),
                );
              } else {
                lb.style.opacity = "1";
                lbImg.classList.remove("exit-animate");
                lbImg.style.opacity = "";
                let finalDx = dx;
                if (currentIndex === 0 && dx > 0) finalDx = 0;
                else if (currentIndex === currentGallery.length - 1 && dx < 0)
                  finalDx = 0;
                lbImg.style.transform = `translateX(${finalDx}px) scale(1)`;
              }
            }
          } else if (pointerCache.length === 2) {
            const d = ptDist(pointerCache[0], pointerCache[1]);
            scale = Math.max(1, Math.min(5, baseScale * (d / lastPinchDist)));
            if (scale === 1) {
              translateX = 0;
              translateY = 0;
            }
            applyTransform();
          }
        });
        function handlePointerUp(e) {
          if (!isDragging) {
            removePtrCache(e);
            return;
          }
          const wasSingle =
            pointerCache.length === 1 && scale === 1 && isPointerDown;
          let finalDx = 0,
            finalDy = 0;
          if (wasSingle) {
            finalDx = e.clientX - pointerStartX;
            finalDy = e.clientY - pointerStartY;
            if (currentIndex === 0 && finalDx > 0) finalDx = 0;
            else if (currentIndex === currentGallery.length - 1 && finalDx < 0)
              finalDx = 0;
          }
          removePtrCache(e);
          if (pointerCache.length === 0) {
            isDragging = false;
            isPointerDown = false;
            if (scale > 1) {
              lbImg.style.transition = "transform 0.2s ease-out";
              applyTransform();
              return;
            }
            lb.style.transition = "opacity 0.2s ease";
            lb.style.opacity = "1";
            if (Math.abs(finalDy) > Math.abs(finalDx) && finalDy < -60) {
              closeLightbox("up");
              return;
            }
            lbImg.style.transition =
              "transform 0.22s cubic-bezier(0.25,1,0.5,1)";
            if (Math.abs(finalDx) > SWIPE_TH) {
              finalDx > 0 ? showPrev() : showNext();
            } else {
              lbImg.classList.remove("exit-animate");
              lbImg.style.opacity = "";
              lbImg.style.transform = "translateX(0) scale(1)";
            }
          } else if (pointerCache.length === 1) {
            isPointerDown = false;
            lastPinchDist = 0;
          }
        }
        lbImg.addEventListener("pointerup", handlePointerUp);
        lbImg.addEventListener("pointercancel", handlePointerUp);
        lbImg.addEventListener("pointerleave", handlePointerUp);

        lb.onclick = (e) => {
          if (e.target === lb && scale === 1) closeLightbox();
        };

        lbImg.addEventListener("click", (e) => {
          const now = Date.now();
          const movedX = Math.abs(e.clientX - pointerStartX),
            movedY = Math.abs(e.clientY - pointerStartY);
          if (movedX > 6 || movedY > 6) return;
          if (now - lastClickTime < 280) {
            if (scale > 1) {
              lbImg.style.transition =
                "transform 0.25s cubic-bezier(0.25,1,0.5,1)";
              resetTransform();
            } else {
              scale = 2.5;
              const rect = lbImg.getBoundingClientRect();
              const cx = e.clientX - rect.left - rect.width / 2;
              const cy = e.clientY - rect.top - rect.height / 2;
              translateX = -cx * 1.5;
              translateY = -cy * 1.5;
              lbImg.style.transition =
                "transform 0.25s cubic-bezier(0.25,1,0.5,1)";
              applyTransform();
            }
            lastClickTime = 0;
          } else {
            lastClickTime = now;
          }
        });

        document.addEventListener("keydown", (e) => {
          if (lb.style.display !== "flex") return;
          if (e.key === "Escape") closeLightbox();
          if (scale !== 1) return;
          if (e.key === "ArrowRight") showNext();
          if (e.key === "ArrowLeft") showPrev();
        });
      }

      // ---------- 搜索逻辑 (略 保持原样) ----------
      function getCleanTextForSearch(rawContent) {
        /* ... 完整保留 ... */
        let text = Array.isArray(rawContent)
          ? rawContent.join("\n\n")
          : rawContent || "";
        text = text.replace(/```[a-zA-Z0-9_-]*/g, "").replace(/`/g, "");
        return text;
      }

      function parseSearchTerms(value) {
        return String(value || "")
          .trim()
          .toLowerCase()
          .split(/\s+/)
          .map((term) => term.trim())
          .filter(Boolean);
      }

      function highlightSearchTermsInHTML(html, terms) {
        const uniqueTerms = [...new Set((terms || []).filter(Boolean))].sort(
          (a, b) => b.length - a.length,
        );
        if (!uniqueTerms.length) return html;
        const regex = new RegExp(
          `(${uniqueTerms.map(escapeRegExp).join("|")})`,
          "gi",
        );
        return html.replace(/(^|>)([^<]+)(?=<|$)/g, (full, prefix, text) => {
          return (
            prefix +
            text.replace(regex, '<span class="search-keyword-hit">$1</span>')
          );
        });
      }

      function renderSearchResults(resetPage = true) {
        if (resetPage) searchPage = 1;
        const start = (searchPage - 1) * searchPerPage,
          end = start + searchPerPage;
        const pageR = currentSearchResults.slice(start, end);
        if (resetPage && searchPage === 1) searchResultsDiv.innerHTML = "";

        pageR.forEach((post) => {
          const div = document.createElement("article");
          div.className = "post";
          const hasImages =
            Array.isArray(post.images) && post.images.length > 0;
          const hasSingleImage =
            Array.isArray(post.images) && post.images.length === 1;
          const privateMemoMark = buildPrivateMemoMark(post);

          // 处理内容：先解析短代码，再解析 Markdown
          let raw = Array.isArray(post.content)
            ? post.content.join("\n\n")
            : post.content || "";
          const isPolaroid = hasPolaroidTag(raw);
          if (isPolaroid) raw = stripPolaroidKeyword(raw);
          let processed = raw;
          if (
            window.HWPlayer &&
            typeof window.HWPlayer.parseShortcodes === "function"
          ) {
            processed = window.HWPlayer.parseShortcodes(raw);
          }
          let parsed = marked.parse(processed);
          parsed = highlightSearchTermsInHTML(parsed, currentSearchTerms);

          const showTime = formatRelativeTime(post.date);

          let imagesHtml = "";
          if (hasImages) {
            const imgs = post.images
              .map((url) => `<img src="${url}" alt="" draggable="false">`)
              .join("");
            if (hasSingleImage) {
              const polaroidClass = isPolaroid ? " polaroid" : "";
              imagesHtml = `<div class="post-image-single${polaroidClass}"><div class="post-images-wrap scrapbook-gallery-source"><div class="post-images"><div class="img-slide">${imgs}</div><div class="img-dots"></div></div></div></div>`;
            } else {
              const scrapbookHtml = window.__scrapbookPreview
                ? window.__scrapbookPreview.buildScrapbookPreview(post)
                : "";
              imagesHtml = `<div class="post-image-dual"><div class="post-images-wrap scrapbook-gallery-source"><div class="post-images"><div class="img-slide">${imgs}</div><div class="img-dots"></div></div></div><div class="scrapbook-preview-host">${scrapbookHtml}</div></div>`;
            }
          }

          // 操作按钮：编辑 + 查看
          const hasAuth = !!getPublishPassword();
          let actionsHtml = "";
          if (hasAuth) {
            actionsHtml = `<div class="post-actions">
            <button class="post-action-btn" onclick="viewPost('${post.id}')" title="查看">
                    <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24">
                        <path d="M0 0h24v24H0z" fill="none" />
                        <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
                            <circle cx="12" cy="12" r="3" />
                            <path d="M3 7V5a2 2 0 0 1 2-2h2m10 0h2a2 2 0 0 1 2 2v2m0 10v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2" />
                        </g>
                    </svg>
                </button>
                <button class="post-action-btn edit-btn" onclick="openEditEditor('${post.id}')" title="编辑">
                    <svg width="1.1em" height="1.1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path></svg>
                </button>
                
                <button class="post-action-btn delete-btn" onclick="deletePost('${post.id}')" title="删除">
                    <svg width="1.1em" height="1.1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
                </button>
            </div>`;
          }

          const postRightClass = hasImages
            ? `post-right${hasSingleImage ? " single-media" : ""}`
            : "post-content-only";

          div.innerHTML = `
            <div class="post-header">
                <span class="post-time">${randomColorBlock()} ${showTime}</span>
                ${privateMemoMark}
                ${actionsHtml}
            </div>
            <div class="${postRightClass}">
                ${imagesHtml}
                <div class="post-content">${parsed}</div>
            </div>
        `;
          searchResultsDiv.appendChild(div);
        });

        // 绑定图片点击灯箱
        bindImagesInContainer(searchResultsDiv);

        // 绑定剪贴簿预览点击
        if (window.__scrapbookPreview) {
          window.__scrapbookPreview.bindScrapbookPreviewClicks(
            searchResultsDiv,
          );
        }

        // **挂载播放器（关键）**
        if (window.HWPlayer && typeof window.HWPlayer.mountAll === "function") {
          window.HWPlayer.mountAll(searchResultsDiv);
        }

        // 移除旧的“加载更多”按钮
        const oldLoader = document.getElementById("searchLoader");
        if (oldLoader) oldLoader.remove();

        // 如果有更多结果，添加“加载更多”按钮
        if (end < currentSearchResults.length) {
          const ldr = document.createElement("button");
          ldr.type = "button";
          ldr.id = "searchLoader";
          ldr.className = "search-loader more-btn";
          ldr.textContent = `加载更多（剩余 ${currentSearchResults.length - end} 条）`;
          ldr.addEventListener(
            "click",
            () => {
              searchPage += 1;
              renderSearchResults(false);
            },
            { once: true },
          );
          searchResultsDiv.appendChild(ldr);
        }
      }

      function updateSearchBackToTop() {
        if (!searchModal || !searchBackToTopBtn) return;
        const open = searchModal.classList.contains("open");
        const scrolled = searchModal.scrollTop > 260;
        searchBackToTopBtn.classList.toggle("show", open && scrolled);
      }

      if (searchModal && searchBackToTopBtn) {
        searchModal.addEventListener("scroll", updateSearchBackToTop, {
          passive: true,
        });
        searchBackToTopBtn.addEventListener("click", () => {
          searchModal.scrollTo({ top: 0, behavior: "smooth" });
        });
      }

      async function performSearch() {
        const rawKeyword = modalSearchInput.value.trim();
        const terms = parseSearchTerms(rawKeyword);
        currentSearchKeyword = rawKeyword.toLowerCase();
        currentSearchTerms = terms;
        if (!terms.length) {
          currentSearchResults = [];
          searchResultsDiv.innerHTML = '<div class="search-loader">✨ 输入关键词看看</div>';
          return;
        }
        searchResultsDiv.innerHTML = '<div class="search-loader">🔍 搜索中...</div>';
        try {
          let searchSource = allPosts;
          if (privateSearchEnabled) {
            const pwd = getPublishPassword();
            if (!pwd) throw new Error("请先输入发布手账密码");
            const res = await fetch(`${WORKER_URL}/api/get-private-memos`, {
              method: "POST", headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ publishPassword: pwd })
            });
            const json = await res.json();
            if (!res.ok || json.code !== 200) throw new Error(json.msg || "获取隐私手账失败");
            searchSource = json.data || [];
          }
          currentSearchResults = searchSource.filter((p) => {
            const text = getCleanTextForSearch(p.content).toLowerCase();
            return terms.every((term) => text.includes(term));
          });
          if (!currentSearchResults.length) searchResultsDiv.innerHTML = '<div class="search-loader">😢 没有找到相关手账</div>';
          else { searchResultsDiv.innerHTML = ""; renderSearchResults(true); }
        } catch (err) {
          console.error(err);
          currentSearchResults = [];
          searchResultsDiv.innerHTML = `<div class="search-loader">搜索失败：${err.message}</div>`;
        }
      }
      function refreshSearchAfterMutation() {
        if (searchModal?.classList.contains("open") && currentSearchKeyword) performSearch();
      }

      function openSearchModal() {
        lastScrollY = window.scrollY;
        searchModal.classList.add("open");
        requestAnimationFrame(updateSearchBackToTop);
        document.body.style.overflow = "hidden";
        modalSearchInput.value = "";
        updatePrivateSearchFilterAccess();
        modalSearchInput.focus();
        performSearch();
      }
      function closeSearchModalFunc() {
        searchModal.classList.remove("open");
        updateSearchBackToTop();
        document.body.style.overflow = "";
        window.scrollTo(0, lastScrollY);
      }

      // ---------- 发布功能 ----------
      function setPublishPassword(p) {
        /* 简写保留完整 */ const e = new Date(
          Date.now() + PUBLISH_PWD_DAYS * 86400000,
        ).toUTCString();
        document.cookie = `${PUBLISH_PWD_KEY}=${encodeURIComponent(p)}; expires=${e}; path=/; SameSite=Lax`;
      }
      function getPublishPassword() {
        const m = document.cookie.match(
          new RegExp(`(?:^|; )${PUBLISH_PWD_KEY}=([^;]*)`),
        );
        return m ? decodeURIComponent(m[1]) : "";

            setPublishPassword(pwd);
            const originalPost =
              allPosts.find((p) => p.id === currentEditId) ||
              filtered.find((p) => p.id === currentEditId);
            const updatedPost = {
              id: currentEditId,
              date: originalPost?.date || getNowBeijingString(),
              content,
              images: [...existingImagesForEdit, ...newImgList],
            };
            preserveViewportDuring(() => {
              upsertPostInLists(updatedPost);
              if (publishModal) {
                publishModal.remove();
                publishModal = null;
              }
              selectedPublishFiles.forEach((i) =>
                URL.revokeObjectURL(i.previewUrl),
              );
              selectedPublishFiles = [];
              render(true);
            });
            showToast("本地演示已更新", "edit");
            scrollToPostWithRetry(updatedPost.id, "center", 14);
            return;
          }

          const res = await fetch(WORKER_URL, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              id: currentEditId,
              publishPassword: pwd,
              content,
              existingImages: existingImagesForEdit,
              newImgList,
            }),
          });
          const json = await res.json();
          if (json.code === 200) {
            setPublishPassword(pwd);
            const updatedPost = json.data;
            const originalPost =
              allPosts.find((p) => p.id === currentEditId) ||
              filtered.find((p) => p.id === currentEditId);
            if (originalPost?.date) updatedPost.date = originalPost.date;
            preserveViewportDuring(() => {
              upsertPostInLists(updatedPost);
              if (publishModal) {

                publishModal = null;
              }
              selectedPublishFiles.forEach((i) =>

              render(true);
            });
            showToast("更新成功", "edit");
            refreshSearchAfterMutation();
            scrollToPostWithRetry(updatedPost.id, "center", 12);
          } else {
            if (json.code === 403) clearPublishPassword();
            showToast(json.msg || "更新失败", "error");
          }
        } catch (e) {
          showToast("网络错误，更新失败", "error");

    <script>
      window.__scrapbookPreview = (function () {
        function buildScrapbookPreview(item) {
          const images = Array.isArray(item && item.images)
            ? item.images.filter(Boolean)
            : [];
          if (!images.length) return "";
          if (images.length === 1) {
            return `<div class="scrapbook-stack" data-preview-count="1"><div class="scrapbook-photo ${Math.random() > 0.5 ? "single-a" : "single-b"} clip" data-preview-index="0"><img src="${images[0]}" alt=""></div></div>`;
          }
          const previewImages = images.slice(0, 6);
          const extra = images.length - 6;
          return `<div class="scrapbook-grid" data-preview-count="${images.length}" data-grid-count="${previewImages.length}">${previewImages
            .map((src, index) => {
              const plusClass = extra > 0 && index === 5 ? " plus" : "";
              const plusAttr =
                extra > 0 && index === 5 ? ` data-plus="+${extra}"` : "";
              return `<div class="scrapbook-grid-item${plusClass}"${plusAttr} data-preview-index="${index}"><img src="${src}" alt=""></div>`;
            })
            .join("")}</div>`;
        }

        function bindScrapbookPreviewClicks(root) {
          (root || document)
            .querySelectorAll(".scrapbook-preview-host")
            .forEach((host) => {
              if (host.dataset.boundPreviewClick) return;
              host.dataset.boundPreviewClick = "1";
              host.addEventListener("click", (e) => {
                const clicked = e.target.closest(
                  ".scrapbook-photo, .scrapbook-grid-item",
                );
                if (!clicked) return;
                const card = host.closest(".post, article");
                const imgs = [
                  ...(card
                    ? card.querySelectorAll(".scrapbook-gallery-source img")
                    : []),
                ];
                if (!imgs.length) return;
                const index = Number(clicked.dataset.previewIndex || 0);
                currentGallery = imgs.map((i) => i.src);
                currentIndex = Math.max(
                  0,
                  Math.min(index, currentGallery.length - 1),
                );
                if (typeof openLightbox === "function") openLightbox();
              });
            });
        }

        return { buildScrapbookPreview, bindScrapbookPreviewClicks };
      })();
