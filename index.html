<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>手账</title>
    <link
      rel="stylesheet"
      href="https://cdn.staticfile.org/lxgw-wenkai-screen-webfont/1.7.0/style.min.css"
    />
    <link
      rel="icon"
      href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect x="15" y="20" width="70" height="60" rx="6" fill="%23fff9e6" stroke="%23323232" stroke-width="3"/><line x1="25" y1="35" x2="75" y2="35" stroke="%23323232" stroke-width="2"/><line x1="25" y1="45" x2="70" y2="45" stroke="%23323232" stroke-width="2"/><line x1="25" y1="55" x2="65" y2="55" stroke="%23323232" stroke-width="2"/><line x1="25" y1="65" x2="75" y2="65" stroke="%23323232" stroke-width="2"/><path d="M80 15 L85 20 L75 30 L70 25 Z" fill="%23E5AA70" stroke="%23323232" stroke-width="2"/></svg>'
    />
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>

      :root {
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-left: env(safe-area-inset-left, 0px);
        --safe-right: env(safe-area-inset-right, 0px);

        --bg: #f3e9dd;
        --paper: #fff9e6;
        --paper-2: #fff6dd;
        --text: #323232;
        --ink: #323232;
        --accent: #e5aa70;
        --accent-dark: #d4924f;
        --border: #323232;
        --secondary-text: #6a635d;
        --gold-glow: rgba(229, 170, 112, 0.24);
        --img-brightness: 1;
        --dot-normal: #d8cfbf;
        --dot-active: #e5aa70;
        --shadow-hard: 4px 4px 0 rgba(50, 50, 50, 0.92);
        --shadow-soft: 0 10px 28px rgba(50, 50, 50, 0.08);
        --radius-card: 26px;
        --radius-card-alt: 30px;
        --radius-soft: 18px;
        --radius-pill: 999px;
        --menu-paper-bg: rgba(243, 233, 221, 0.84);
        --menu-paper-border: rgba(50, 50, 50, 0.1);
        --menu-paper-text: #6d5845;
        --menu-paper-active-bg: rgba(255, 249, 230, 0.88);
        --menu-paper-active-text: #b2743f;
        --lightbox-rgb: 243, 233, 221;
        --lightbox-bg: rgba(243, 233, 221, 0.96);
        --lightbox-btn-bg: #fff9e6;
        --lightbox-btn-color: #323232;
      }

      body.dark {
        --bg: #1a1917;
        --paper: #23211e;
        --paper-2: #2b2925;
        --text: #f3e9dd;
        --ink: #f3e9dd;
        --accent: #daa06d;
        --accent-dark: #e5aa70;
        --border: #f3e9dd;
        --secondary-text: #b7ada2;
        --gold-glow: rgba(218, 160, 109, 0.24);
        --img-brightness: 0.9;
        --dot-normal: #514c46;
        --dot-active: #daa06d;
        --shadow-hard: 4px 4px 0 rgba(243, 233, 221, 0.16);
        --shadow-soft: 0 12px 30px rgba(0, 0, 0, 0.24);
        --menu-paper-bg: rgba(35, 33, 30, 0.86);
        --menu-paper-border: rgba(243, 233, 221, 0.14);
        --menu-paper-text: #d7c6b2;
        --menu-paper-active-bg: rgba(229, 170, 112, 0.16);
        --menu-paper-active-text: #ffd88c;
        --lightbox-rgb: 26, 25, 23;
        --lightbox-bg: rgba(26, 25, 23, 0.98);
        --lightbox-btn-bg: #2d2a26;
        --lightbox-btn-color: #f3e9dd;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        min-height: 100dvh;
        margin: 0;
        overflow-x: hidden !important;
        overscroll-behavior-x: none;
      }

      body {
        font-family: "LXGW WenKai Screen", sans-serif;
        color: var(--text);
        background-color: var(--bg);
        background-image: url('https://images.weserv.nl/?url=https://raw.githubusercontent.com/jacktom12/blogpic3/main/wallpaperlight.png');
        background-size: auto 100vh;
        background-repeat: repeat-x;
        background-position: center top;
        background-attachment: fixed;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        display: flex;
        justify-content: center;
        touch-action: pan-y;
      }

      body.dark {
        background-image: url('https://images.weserv.nl/?url=https://raw.githubusercontent.com/jacktom12/blogpic3/main/wallpaperdark.png');
      }

      a {
        color: #4d78d8;
      }

      body.dark a {
        color: #ffd88c;
      }

      button,
      input,
      textarea {
        font: inherit;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .app-container {
        width: 100%;
        max-width: 660px;
        height: 100dvh;
        display: flex;
        flex-direction: column;
        position: relative;
        overflow: hidden;
      }

      main {
        flex: 1;
        overflow-y: auto;
        overflow-x: hidden;
        padding: 0 16px calc(86px + var(--safe-bottom));
        scrollbar-width: thin;
        scrollbar-color: var(--border) transparent;
        -webkit-mask-image: linear-gradient(to bottom, transparent, black 16px);
        mask-image: linear-gradient(to bottom, transparent, black 16px);
      }

      main::-webkit-scrollbar,
      .app-container::-webkit-scrollbar,
      .search-modal::-webkit-scrollbar,
      .search-results::-webkit-scrollbar,
      .publish-panel::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }

      main::-webkit-scrollbar-thumb,
      .app-container::-webkit-scrollbar-thumb,
      .search-modal::-webkit-scrollbar-thumb,
      .search-results::-webkit-scrollbar-thumb,
      .publish-panel::-webkit-scrollbar-thumb {
        background: var(--border);
        border: 2px solid var(--bg);
        border-radius: 999px;
      }

      #postsContainer {
        position: relative;
        padding-top: 16px;
      }

      #postsContainer::before {
        content: "";
        position: absolute;
        top: -10px;
        left: 50%;
        transform: translateX(-50%);
        width: min(92%, 760px);
        height: 30px;
        background:
          repeating-linear-gradient(
            to bottom,
            rgba(50, 50, 50, 0.06) 0 2px,
            transparent 2px 8px
          ),
          linear-gradient(180deg, rgba(255, 249, 230, 0.96), rgba(243, 233, 221, 0.98));
        border-left: 2px solid rgba(50, 50, 50, 0.18);
        border-right: 2px solid rgba(50, 50, 50, 0.18);
        box-shadow: inset 0 6px 10px rgba(0, 0, 0, 0.06);
        pointer-events: none;
        z-index: 0;
      }

      body.dark #postsContainer::before {
        background:
          repeating-linear-gradient(
            to bottom,
            rgba(243, 233, 221, 0.06) 0 2px,
            transparent 2px 8px
          ),
          linear-gradient(180deg, rgba(45, 42, 38, 0.96), rgba(26, 25, 23, 0.98));
        border-left-color: rgba(243, 233, 221, 0.18);
        border-right-color: rgba(243, 233, 221, 0.18);
        box-shadow: inset 0 6px 10px rgba(255, 255, 255, 0.03);
      }

      #postsContainer .post:first-child {
        position: relative;
        z-index: 1;
      }

      #postsContainer .post:first-child::before {
        content: "";
        position: absolute;
        top: -18px;
        left: 24px;
        right: 24px;
        height: 18px;
        z-index: -1;
        border-top: 2px solid rgba(50, 50, 50, 0.2);
        border-radius: 8px 8px 0 0;
        background:
          repeating-linear-gradient(
            to right,
            transparent 0 10px,
            rgba(50, 50, 50, 0.1) 10px 12px
          ),
          linear-gradient(180deg, rgba(255, 249, 230, 0.95), rgba(255, 249, 230, 0.65));
        pointer-events: none;
      }

      body.dark #postsContainer .post:first-child::before {
        background:
          repeating-linear-gradient(
            to right,
            transparent 0 10px,
            rgba(243, 233, 221, 0.08) 10px 12px
          ),
          linear-gradient(180deg, rgba(45, 42, 38, 0.95), rgba(45, 42, 38, 0.6));
        border-top-color: rgba(243, 233, 221, 0.16);
      }

      .topbar {
        z-index: 20;
        flex-shrink: 0;
        padding-top: calc(var(--safe-top) + 5px);
        padding-bottom: 4px;
      }

      .topbar-inner {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        margin: 0 16px;
        padding: 14px 20px;
        background: var(--paper);
        color: var(--text);
        border: 2px solid var(--border);
        border-radius: 18px;
        box-shadow: var(--shadow-hard);
      }

      .blog-brand {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 6px 18px;
        background: var(--accent);
        color: var(--ink) !important;
        border: 2px solid var(--border);
        border-radius: 16px;
        box-shadow: 3px 3px 0 var(--border);
        font-size: 1.45rem;
        font-weight: 900;
        letter-spacing: 1px;
        text-transform: uppercase;
        text-decoration: none;
        user-select: none;
        cursor: pointer;
      }

      .topbar-right {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }

      .topbar-icon,
      .theme-option,
      .close-search-btn,
      .post-action-btn,
      .img-nav-btn,
      .back-to-top {
        appearance: none;
        border: 2px solid var(--border);
        background: var(--paper);
        color: var(--text);
        box-shadow: 3px 3px 0 var(--border);
        border-radius: 14px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        transition: background 0.18s ease, color 0.18s ease, box-shadow 0.18s ease;
      }

      .topbar-icon {
        padding: 6px 10px;
        font-size: 1.1rem;
      }

      .topbar-icon svg,
      .theme-option svg,
      .post-action-btn svg {
        width: 1.1em;
        height: 1.1em;
        display: block;
      }

      .menu {
        position: fixed;
        left: 50%;
        bottom: calc(12px + var(--safe-bottom));
        transform: translateX(-50%);
        width: calc(100% - 24px);
        max-width: 580px;
        display: flex;
        align-items: stretch;
        justify-content: space-between;
        gap: 8px;
        padding: 8px;
        z-index: 11000;
        border: 1px solid var(--menu-paper-border);
        border-radius: 26px;
        background: var(--menu-paper-bg);
        box-shadow: 0 12px 30px rgba(50, 50, 50, 0.12);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
      }

      .menu::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        pointer-events: none;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.45);
      }

      .menu .menu-item {
        flex: 1 1 0;
        min-width: 0;
        border: 0;
        background: transparent;
        color: var(--menu-paper-text);
        border-radius: 18px;
        padding: 10px 8px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        cursor: pointer;
        font-weight: 900;
        transition: background-color 0.18s ease, color 0.18s ease;
      }

      .menu .menu-item svg {
        width: 1.35rem;
        height: 1.35rem;
        display: block;
      }

      .menu .menu-item span {
        display: block;
        margin-top: 2px;
        font-size: 0.88rem;
        line-height: 1.1;
      }

      .menu .menu-item:hover,
      .menu .menu-item:focus-visible {
        background: rgba(255, 249, 230, 0.52);
        color: #8d633d;
      }

      .menu .menu-item.active {
        background: var(--menu-paper-active-bg);
        color: var(--menu-paper-active-text);
      }

      .post {
        position: relative;
        margin: 28px 0;
        padding: 24px;
        color: var(--text);
        background:
          repeating-linear-gradient(
            transparent,
            transparent 28px,
            rgba(0, 0, 0, 0.03) 28px,
            rgba(0, 0, 0, 0.05) 30px
          ),
          var(--paper);
        border: 2px solid var(--border);
        border-radius: var(--radius-card);
        box-shadow: var(--shadow-hard);
        display: flex;
        flex-direction: column;
        overflow: visible;
        transition: box-shadow 0.2s ease, border-color 0.2s ease;
      }

      body.dark .post {
        background:
          repeating-linear-gradient(
            transparent,
            transparent 28px,
            rgba(255, 255, 255, 0.04) 28px,
            rgba(255, 255, 255, 0.055) 30px
          ),
          var(--paper);
      }

      .post:nth-child(even) {
        border-radius: var(--radius-card-alt);
      }

      .post:hover {
        box-shadow: var(--shadow-hard);
      }

      body:not(.dark) .post:hover {
        transform: none !important;
        border-color: var(--border);
        box-shadow: 0 0 18px rgba(229, 170, 112, 0.24) !important;
      }

      body.dark .post:hover {
        box-shadow:
          0 0 18px rgba(218, 160, 109, 0.25),
          0 0 36px rgba(218, 160, 109, 0.12);
      }

      .post::after,
      .post::before,
      body:not(.dark) .post:hover::before,
      body:not(.dark) .post:hover::after {
        display: none;
        content: none;
      }

      .post.pinned {
        margin-top: 26px;
        padding-top: 24px;
        border-color: var(--accent-dark);
        background:
          linear-gradient(180deg, rgba(229, 170, 112, 0.08), rgba(229, 170, 112, 0.02)),
          repeating-linear-gradient(
            transparent,
            transparent 28px,
            rgba(0, 0, 0, 0.03) 28px,
            rgba(0, 0, 0, 0.05) 30px
          ),
          var(--paper);
        box-shadow: 0 8px 18px rgba(0, 0, 0, 0.1);
      }

      .pin-badge {
        position: absolute;
        top: 0;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 8;
        pointer-events: none;
      }

      .pin-badge-text {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 4px 10px;
        white-space: nowrap;
        color: var(--text);
        background: var(--paper);
        border: 2px solid var(--border);
        border-radius: 999px;
        box-shadow: 3px 3px 0 var(--border);
        font-size: 12px;
        line-height: 1;
        font-weight: 900;
      }

      .pin-badge-text svg {
        width: 16px;
        height: 16px;
        flex: 0 0 16px;
        display: block;
        color: var(--accent-dark);
      }

      body.dark .pin-badge-text svg {
        color: var(--accent);
      }

      .post-header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 14px;
        padding-bottom: 2px;
      }

      .post-time {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 3px 12px;
        background: #a8c9a8;
        color: var(--ink);
        border: 2px solid var(--border);
        border-radius: 16px;
        font-size: 0.8rem;
        font-weight: 900;
        letter-spacing: 0.5px;
      }

      body.dark .post-time {
        background: #3d5c5c;
      }

      .post-actions {
        display: flex;
        gap: 8px;
        margin-left: auto;
      }

      .post-action-btn {
        padding: 5px 8px;
      }

      .post-action-btn.delete-btn {
        color: #e53e3e;
      }

      body.dark .post-action-btn.delete-btn {
        color: #fc8181;
      }

      .post-right,
      .search-results .post-right {
        flex-grow: 1;
        min-width: 0;
        overflow: hidden;
      }

      .post-content-only,
      .post-right.single-media,
      .post-image-dual {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 14px;
      }

      .post-content {
        min-width: 0;
        font-size: 1.1rem;
        line-height: 1.8;
        word-wrap: break-word;
        font-weight: 500;
      }

      .post-content p {
        margin-top: 0;
        margin-bottom: 8px;
      }

      .post-content h1,
      .post-content h2,
      .post-content h3,
      .post-content h4 {
        margin: 20px 0 12px;
        line-height: 1.4;
        position: relative;
        display: inline-block;
        font-weight: 900;
      }

      .post-content h1 {
        font-size: 1.5rem;
        color: var(--ink);
        background: var(--accent);
        padding: 4px 16px;
        border: 2px solid var(--border);
        border-radius: 16px;
        box-shadow: 3px 3px 0 var(--border);
      }

      .post-content h2 {
        font-size: 1.3rem;
        color: var(--accent-dark);
        padding-bottom: 4px;
        border-bottom: 3px solid var(--accent);
      }

      .post-content h2::after {
        content: "";
        position: absolute;
        left: 0;
        bottom: -4px;
        width: 40%;
        height: 3px;
        background: repeating-linear-gradient(
          90deg,
          var(--accent-dark),
          var(--accent-dark) 4px,
          transparent 4px,
          transparent 8px
        );
      }

      .post-content h3 {
        font-size: 1.12rem;
        color: var(--text);
        padding-left: 14px;
        border-left: 4px solid var(--accent);
      }

      .post-content h4 {
        font-size: 1rem;
        color: var(--secondary-text);
        text-decoration: underline wavy var(--accent) 2px;
        text-underline-offset: 4px;
      }

      .post-content blockquote {
        margin: 18px 0;
        padding: 14px 18px;
        position: relative;
        background: linear-gradient(135deg, rgba(255, 249, 230, 0.88), rgba(229, 170, 112, 0.08));
        border-left: 3px solid var(--accent);
        border-radius: 10px;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
        overflow: hidden;
      }

      body.dark .post-content blockquote {
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.03));
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
      }

      .post-content blockquote::before {
        content: "“";
        position: absolute;
        top: 6px;
        left: 10px;
        font-size: 28px;
        font-weight: 700;
        color: rgba(229, 170, 112, 0.45);
        pointer-events: none;
      }

      .post-content blockquote::after {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        width: 6px;
        opacity: 0.25;
        background: repeating-linear-gradient(
          to bottom,
          var(--accent),
          var(--accent) 2px,
          transparent 2px,
          transparent 6px
        );
      }

      .post-content pre {
        margin: 14px 0;
        padding: 14px 16px;
        overflow: auto;
        border-radius: 14px;
        border: 2px solid var(--border);
        background: rgba(255, 255, 255, 0.4);
      }

      body.dark .post-content pre {
        background: rgba(255, 255, 255, 0.04);
      }

      .post-content code {
        background: var(--accent);
        color: var(--ink);
        padding: 3px 7px;
        border-radius: 6px;
        font-size: 0.88rem;
        font-weight: 700;
      }

      .post-content ul,
      .post-content ol {
        padding-left: 0;
        margin: 0 0 8px;
        list-style: none;
      }

      .post-content li {
        position: relative;
        list-style: none !important;
        margin-bottom: 4px;
      }

      .post-content ul > li:not(:has(input[type="checkbox"])),
      .post-content ol > li {
        padding-left: 26px;
      }

      .post-content ul > li:not(:has(input[type="checkbox"]))::before {
        content: "";
        position: absolute;
        left: 2px;
        top: 0.65em;
        width: 9px;
        height: 9px;
        background: var(--accent);
        border: 2px solid var(--border);
        border-radius: 6px;
      }

      .post-content ol {
        counter-reset: sketch-ol;
      }

      .post-content ol > li::before {
        counter-increment: sketch-ol;
        content: counter(sketch-ol);
        position: absolute;
        left: 0;
        top: -1px;
        min-width: 18px;
        height: 18px;
        padding: 0 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--accent);
        color: var(--ink);
        font-size: 0.72rem;
        font-weight: 900;
        border: 2px solid var(--border);
        border-radius: 8px;
        box-shadow: 1.5px 1.5px 0 var(--border);
      }

      .post-content input[type="checkbox"] {
        appearance: none;
        -webkit-appearance: none;
        width: 18px;
        height: 18px;
        margin-right: 10px;
        vertical-align: middle;
        border: 2px solid var(--border);
        background: var(--paper);
        border-radius: 4px;
        box-shadow: 2px 2px 0 var(--border);
        position: relative;
        cursor: pointer;
      }

      .post-content input[type="checkbox"]:checked {
        background: var(--accent);
      }

      .post-content input[type="checkbox"]:checked::after {
        content: "✓";
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -55%);
        font-size: 14px;
        font-weight: 900;
        color: var(--ink);
      }

      .post-content a {
        color: #4d78d8;
        text-decoration: underline;
        text-decoration-thickness: 1.5px;
        text-underline-offset: 3px;
      }

      body.dark .post-content a {
        color: #ffd88c;
        text-decoration-color: rgba(255, 216, 140, 0.92);
      }

      .post-images-wrap {
        position: relative;
        width: 100%;
      }

      .post-images {
        overflow: hidden;
        padding: 12px 0 4px;
        cursor: grab;
        contain: layout;
      }

      .post-images.dragging {
        cursor: grabbing;
      }

      .img-slide {
        display: flex;
        gap: 12px;
        position: relative;
        will-change: transform;
      }

      .post-images img {
        height: 190px;
        width: auto;
        max-width: 85%;
        object-fit: cover;
        user-select: none;
        -webkit-user-drag: none;
        filter: brightness(var(--img-brightness));
        border: 2px solid var(--border);
        border-radius: var(--radius-card);
        box-shadow: 3px 3px 0 var(--border);
        transition: border-color 0.18s ease, box-shadow 0.18s ease;
      }

      .post-images img:hover {
        border-color: var(--accent);
        box-shadow: 4px 4px 0 var(--border);
      }

      .post-images.single-image img {
        width: auto;
        max-width: 100%;
        height: auto;
        max-height: 380px;
        display: block;
      }

      .img-dots {
        display: flex;
        justify-content: center;
        gap: 6px;
        margin-top: 14px;
      }

      .img-dots .dot {
        width: 12px;
        height: 6px;
        background: var(--dot-normal);
        border: 1px solid var(--border);
        transform: skewX(-20deg);
        cursor: pointer;
        transition: all 0.15s ease;
      }

      .img-dots .dot.active {
        width: 24px;
        background: var(--dot-active);
      }

      .img-nav-btn {
        position: absolute;
        top: 50%;
        transform: translateY(-60%);
        width: 34px;
        height: 34px;
        font-size: 1rem;
        font-weight: 900;
        z-index: 10;
      }

      .img-nav-prev {
        left: 4px;
      }

      .img-nav-next {
        right: 4px;
      }

      .img-nav-btn.hidden {
        opacity: 0;
        pointer-events: none;
      }

      .post-image-single {
        width: 100%;
        margin: 6px 0 2px;
      }

      .post-image-single .post-images-wrap {
        width: 100%;
        display: block;
        overflow: hidden;
        padding: 10px;
        background: rgba(255, 249, 230, 0.56);
        border: 1.5px solid rgba(50, 50, 50, 0.14);
        border-radius: 18px;
      }

      body.dark .post-image-single .post-images-wrap {
        background: rgba(255, 255, 255, 0.04);
        border-color: rgba(243, 233, 221, 0.12);
      }

      .post-image-dual .scrapbook-preview-host,
      .search-results .post-image-dual .scrapbook-preview-host {
        width: 100%;
      }

      .scrapbook-gallery-source {
        display: none;
      }

      .scrapbook-stack {
        position: relative;
        width: min(100%, 300px);
        height: 206px;
        margin: 0 auto;
      }

      .scrapbook-photo {
        position: absolute;
        overflow: hidden;
        border: 2px solid var(--border);
        border-radius: 16px;
        box-shadow: 3px 3px 0 rgba(50, 50, 50, 0.22);
        background: var(--paper);
      }

      .scrapbook-photo img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
      }

      .scrapbook-photo.clip::before,
      .scrapbook-photo.first::before,
      .scrapbook-photo.second::before {
        content: "";
        position: absolute;
        top: -7px;
        left: 50%;
        transform: translateX(-50%);
        width: 54px;
        height: 16px;
        border-radius: 4px;
        background: rgba(229, 210, 182, 0.78);
        z-index: 2;
      }

      body.dark .scrapbook-photo.clip::before,
      body.dark .scrapbook-photo.first::before,
      body.dark .scrapbook-photo.second::before {
        background: rgba(147, 121, 92, 0.4);
      }

      .scrapbook-photo.single-a,
      .scrapbook-photo.single-b {
        inset: 0;
      }

      .scrapbook-photo.single-a {
        transform: rotate(-2deg);
      }

      .scrapbook-photo.single-b {
        transform: rotate(1.5deg);
      }

      .scrapbook-photo.variant-a.first,
      .scrapbook-photo.variant-b.first {
        width: 62%;
        height: 88%;
        left: 0;
        bottom: 0;
      }

      .scrapbook-photo.variant-a.second,
      .scrapbook-photo.variant-b.second {
        width: 62%;
        height: 88%;
        right: 0;
        top: 2%;
      }

      .scrapbook-photo.variant-a.first {
        transform: rotate(-6deg);
      }

      .scrapbook-photo.variant-a.second {
        transform: rotate(4deg);
      }

      .scrapbook-photo.variant-b.first {
        transform: rotate(-4deg);
      }

      .scrapbook-photo.variant-b.second {
        transform: rotate(6deg);
      }

      .scrapbook-photo.plus::after {
        content: attr(data-plus);
        position: absolute;
        right: 10px;
        bottom: 10px;
        padding: 4px 10px;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.68);
        color: #fff;
        font-size: 13px;
        font-weight: 900;
        letter-spacing: 0.3px;
      }

      .loader,
      #loader,
      .search-loader {
        text-align: center;
        padding: 30px;
        color: var(--secondary-text);
        font-weight: 900;
      }

      .search-loader.more-btn {
        display: block;
        width: 100%;
        min-height: 48px;
        padding: 10px 14px;
        border-radius: 14px;
        border: 2px solid var(--border);
        background: var(--paper);
        color: var(--text);
        box-shadow: 3px 3px 0 var(--border);
        cursor: pointer;
      }

      .lightbox {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 300000;
        justify-content: center;
        align-items: center;
        background:
          radial-gradient(
            circle at 50% 45%,
            rgba(var(--lightbox-rgb), 0.82),
            rgba(var(--lightbox-rgb), 0.46) 46%,
            rgba(50, 50, 50, 0.7) 100%
          ),
          rgba(var(--lightbox-rgb), 0.92);
        transition: opacity 0.25s ease, background 0.6s ease;
      }

      .lightbox.lb-closing {
        opacity: 0;
      }

      #lbImg {
        max-width: 80%;
        max-height: 82%;
        object-fit: contain;
        border: 3px solid var(--border);
        border-radius: var(--radius-card);
        background: var(--paper);
        box-shadow: var(--shadow-hard);
        z-index: 2100;
        user-select: none;
        -webkit-user-drag: none;
        touch-action: none;
        transform-origin: center center;
        will-change: transform;
        filter: brightness(var(--img-brightness));
      }

      #lbImg.switching {
        transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.22s ease;
      }

      #lbImg.exit-animate {
        transition: transform 0.24s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.24s ease;
      }

      .lb-counter {
        position: absolute;
        top: 24px;
        right: 24px;
        margin-right: 12px;
        background: var(--accent);
        color: var(--ink);
        border: 2px solid var(--border);
        padding: 8px 20px;
        font-size: 1.05rem;
        font-weight: 900;
        letter-spacing: 0.5px;
        border-radius: 16px;
        box-shadow: 4px 4px 0 var(--border);
        z-index: 3000;
      }

      .lb-btn {
        position: absolute;
        width: 46px;
        height: 46px;
        background: var(--lightbox-btn-bg);
        color: var(--lightbox-btn-color) !important;
        border: 2px solid var(--border);
        border-radius: 14px;
        box-shadow: 3px 3px 0 var(--border);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-size: 1.2rem;
        font-weight: 900;
        z-index: 3100;
      }

      #lbCloseBtn {
        top: 24px;
        left: 24px;
      }

      #lbPrevBtn,
      #lbNextBtn {
        top: 50%;
        transform: translateY(-50%);
      }

      #lbPrevBtn {
        left: 24px;
      }

      #lbNextBtn {
        right: 24px;
      }

      .search-modal {
        position: fixed;
        inset: 0;
        z-index: 200000;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        overflow-y: auto;
        padding: 60px 20px 20px;
        background: rgba(243, 233, 221, 0.97);
        backdrop-filter: blur(18px);
      }

      body.dark .search-modal {
        background: rgba(26, 25, 23, 0.97);
      }

      .search-modal.open {
        display: flex;
      }

      .search-modal-header {
        width: 100%;
        max-width: 700px;
        margin-bottom: 30px;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px 12px 8px 18px;
        background: var(--paper);
        border: 2px solid var(--border);
        border-radius: var(--radius-card);
        box-shadow: 5px 5px 0 var(--border);
      }

      .search-modal-header input {
        flex: 1;
        min-width: 0;
        border: none;
        outline: none;
        background: transparent;
        color: var(--text);
        padding: 10px 0;
        font-size: 1rem;
        font-weight: 700;
      }

      .search-modal-header button {
        flex-shrink: 0;
        white-space: nowrap;
        border: 2px solid var(--border);
        background: var(--accent);
        color: var(--ink);
        padding: 8px 20px;
        border-radius: 14px;
        box-shadow: 3px 3px 0 var(--border);
        cursor: pointer;
        font-weight: 900;
      }

      .search-results {
        width: 100%;
        max-width: 700px;
        margin: 0 auto;
      }

      .search-results .post {
        margin: 0 0 18px;
      }

      .close-search-btn {
        position: absolute;
        top: 20px;
        right: 30px;
        width: 44px;
        height: 44px;
        font-size: 1.5rem;
        box-shadow: 4px 4px 0 var(--accent);
      }

      .publish-mask {
        position: fixed;
        inset: 0;
        z-index: 300001;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        background: rgba(5, 5, 5, 0.6);
        backdrop-filter: blur(4px);
      }

      .publish-panel {
        width: min(100%, 600px);
        max-height: min(85vh, 850px);
        overflow: auto;
        padding: 26px;
        background:
          repeating-linear-gradient(
            transparent,
            transparent 28px,
            rgba(0, 0, 0, 0.02) 28px,
            rgba(0, 0, 0, 0.04) 30px
          ),
          var(--paper);
        color: var(--text);
        border: 2px solid var(--border);
        border-radius: var(--radius-card);
        box-shadow: var(--shadow-hard);
      }

      .publish-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 20px;
        padding-bottom: 12px;
        border-bottom: 2px solid var(--border);
      }

      .publish-title {
        margin: 0;
        font-size: 1.25rem;
        font-weight: 900;
        text-transform: uppercase;
        color: var(--accent-dark);
      }

      .publish-close {
        width: 28px;
        height: 28px;
        border: 2px solid var(--border);
        border-radius: 12px;
        background: transparent;
        color: var(--text);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-weight: 900;
      }

      .publish-field {
        margin-bottom: 18px;
      }

      .publish-label {
        display: block;
        margin-bottom: 6px;
        color: var(--text);
        font-size: 0.85rem;
        font-weight: 900;
        text-transform: uppercase;
      }

      .publish-input,
      .publish-textarea {
        width: 100%;
        padding: 12px;
        outline: none;
        border: 2px solid var(--border);
        border-radius: 18px;
        background: #fff;
        color: #323232;
        box-shadow: 3px 3px 0 var(--border);
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        font-weight: 700;
      }

      body.dark .publish-input,
      body.dark .publish-textarea {
        background: #2d2a26;
        color: #f3e9dd;
      }

      .publish-input:focus,
      .publish-textarea:focus {
        border-color: var(--accent);
        background: #fffef7;
      }

      body.dark .publish-input:focus,
      body.dark .publish-textarea:focus {
        background: #3a3834;
      }

      .publish-textarea {
        min-height: 120px;
        resize: vertical;
      }

      .publish-tools {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 12px;
      }

      .publish-drop-zone {
        padding: 12px;
        border: 2px dashed rgba(50, 50, 50, 0.34);
        border-radius: var(--radius-card);
        transition: background 0.15s ease, border-color 0.15s ease;
      }

      .publish-drop-zone.drag-over {
        background: rgba(229, 170, 112, 0.16);
        border-color: var(--accent-dark);
      }

      body.dark .publish-drop-zone {
        border-color: rgba(243, 233, 221, 0.34);
      }

      body.dark .publish-drop-zone.drag-over {
        background: rgba(218, 160, 109, 0.14);
      }

      .pick-img-btn,
      .publish-submit,
      .publish-cancel {
        border: 2px solid var(--border);
        border-radius: 14px;
        cursor: pointer;
        font-weight: 900;
        transition: background 0.18s ease, color 0.18s ease, box-shadow 0.18s ease;
      }

      .pick-img-btn {
        padding: 6px 14px;
        background: var(--paper);
        color: var(--text);
        box-shadow: 2px 2px 0 var(--border);
      }

      .preview-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
        gap: 8px;
        margin-top: 8px;
      }

      .preview-item {
        position: relative;
        aspect-ratio: 1 / 1;
        overflow: hidden;
        padding: 2px;
        border: 2px solid var(--border);
        border-radius: 16px;
        background: var(--paper);
        cursor: grab;
        transition: opacity 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
      }

      .preview-item img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .preview-item.dragging {
        opacity: 0.45;
      }

      .preview-item.drag-target {
        border-color: var(--accent-dark);
        box-shadow: 4px 4px 0 var(--accent);
      }

      .preview-del {
        position: absolute;
        top: 4px;
        right: 4px;
        width: 22px;
        height: 22px;
        z-index: 2;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--accent);
        color: var(--ink);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-size: 11px;
        font-weight: 900;
      }

      .publish-footer {
        display: flex;
        gap: 12px;
        margin-top: 24px;
      }

      .publish-submit,
      .publish-cancel {
        padding: 12px 20px;
        font-size: 0.95rem;
      }

      .publish-submit {
        flex: 1;
        background: var(--accent);
        color: var(--ink);
        box-shadow: 4px 4px 0 var(--border);
      }

      .publish-submit:disabled {
        opacity: 0.3;
        cursor: not-allowed;
      }

      .publish-cancel {
        min-width: 90px;
        background: transparent;
        color: var(--secondary-text);
      }

      .publish-empty,
      .publish-tip {
        color: var(--secondary-text);
        font-size: 0.85rem;
        font-weight: 700;
      }

      .toast-wrap {
        position: fixed;
        top: calc(28px + var(--safe-top));
        left: 50%;
        transform: translateX(-50%);
        z-index: 400000;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .toast {
        min-width: 270px;
        padding: 14px 24px;
        text-align: center;
        background: var(--paper);
        color: var(--ink);
        border: 2px solid var(--border);
        border-radius: 14px;
        box-shadow: 4px 4px 0 var(--border);
        font-size: 0.95rem;
        font-weight: 900;
        opacity: 0;
        animation: pToastIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      }

      .toast.success {
        color: #d4924f;
      }

      .toast.delete {
        color: #e53e3e;
      }

      .toast.edit {
        color: #3182ce;
      }

      .toast.error {
        background: #ffccd5;
        color: #c0392b;
      }

      .toast.hide {
        animation: pToastOut 0.2s ease forwards;
      }

      @keyframes pToastIn {
        to {
          opacity: 1;
        }
      }

      @keyframes pToastOut {
        to {
          opacity: 0;
          transform: translateY(-10px);
        }
      }

      .back-to-top {
        position: fixed;
        right: 20px;
        bottom: calc(28px + var(--safe-bottom));
        width: 46px;
        height: 46px;
        z-index: 9000;
        font-size: 1.3rem;
        font-weight: 900;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s ease;
      }

      .back-to-top.visible {
        opacity: 1;
        pointer-events: auto;
      }

      .doodle-star,
      .doodle-sparkle,
      .doodle-swirl,
      .doodle-flower,
      .doodle-plane,
      .doodle-clip,
      .doodle-moon,
      .doodle-leaf {
        position: fixed;
        z-index: 9999;
        pointer-events: none;
        will-change: transform;
        opacity: 0.75;
      }

      .doodle-star {
        top: 20px;
        left: 20px;
        width: 48px;
        height: 48px;
        animation: floatStar 11s ease-in-out infinite;
      }

      .doodle-sparkle {
        right: 30px;
        bottom: 30px;
        width: 40px;
        height: 40px;
        animation: floatSparkle 14s ease-in-out infinite 1.2s;
      }

      .doodle-swirl {
        top: 35%;
        right: 15px;
        width: 32px;
        height: 32px;
        animation: floatSwirl 9s ease-in-out infinite 2.5s;
      }

      .doodle-flower {
        bottom: 15%;
        left: 3%;
        width: 30px;
        height: 30px;
        animation: floatFlower 13s ease-in-out infinite 0.8s;
      }

      .doodle-plane {
        top: 20%;
        right: 2%;
        width: 34px;
        height: 34px;
        animation: floatPlane 16s ease-in-out infinite 1.5s;
      }

      .doodle-clip {
        top: 35%;
        left: 2%;
        width: 28px;
        height: 28px;
        animation: floatClip 10s ease-in-out infinite 3s;
      }

      .doodle-moon {
        right: 4%;
        bottom: 25%;
        width: 32px;
        height: 32px;
        animation: floatMoon 12s ease-in-out infinite 0.5s;
      }

      .doodle-leaf {
        top: 60%;
        left: 5%;
        width: 28px;
        height: 28px;
        animation: floatLeaf 15s ease-in-out infinite 2s;
      }

      @keyframes floatStar {
        0%,100% { transform: translate(0,0) rotate(-15deg) scale(1); }
        25% { transform: translate(12px,-18px) rotate(-8deg) scale(1.05); }
        50% { transform: translate(-8px,-30px) rotate(2deg) scale(0.95); }
        75% { transform: translate(18px,-12px) rotate(-4deg) scale(1.02); }
      }

      @keyframes floatSparkle {
        0%,100% { transform: translate(0,0) rotate(10deg) scale(1); }
        30% { transform: translate(-15px,-20px) rotate(18deg) scale(1.08); }
        60% { transform: translate(10px,-35px) rotate(5deg) scale(0.92); }
      }

      @keyframes floatSwirl {
        0%,100% { transform: translate(0,0) rotate(0deg); }
        20% { transform: translate(8px,-12px) rotate(6deg); }
        40% { transform: translate(-12px,-25px) rotate(-4deg); }
        60% { transform: translate(6px,-8px) rotate(3deg); }
        80% { transform: translate(-4px,-18px) rotate(-2deg); }
      }

      @keyframes floatFlower {
        0%,100% { transform: translate(0,0) rotate(0deg); }
        33% { transform: translate(10px,-14px) rotate(6deg); }
        66% { transform: translate(-6px,-26px) rotate(-3deg); }
      }

      @keyframes floatPlane {
        0%,100% { transform: translate(0,0) rotate(-8deg); }
        25% { transform: translate(-18px,-12px) rotate(-2deg); }
        50% { transform: translate(8px,-28px) rotate(4deg); }
        75% { transform: translate(-10px,-16px) rotate(-6deg); }
      }

      @keyframes floatClip {
        0%,100% { transform: translate(0,0) rotate(0deg) skewX(0deg); }
        35% { transform: translate(14px,-10px) rotate(10deg) skewX(4deg); }
        70% { transform: translate(-5px,-22px) rotate(-5deg) skewX(-2deg); }
      }

      @keyframes floatMoon {
        0%,100% { transform: translate(0,0) rotate(0deg) scale(1); }
        40% { transform: translate(-8px,-18px) rotate(8deg) scale(1.06); }
        80% { transform: translate(12px,-30px) rotate(-4deg) scale(0.94); }
      }

      @keyframes floatLeaf {
        0%,100% { transform: translate(0,0) rotate(-3deg); }
        25% { transform: translate(6px,-10px) rotate(1deg); }
        50% { transform: translate(-14px,-22px) rotate(5deg); }
        75% { transform: translate(8px,-14px) rotate(-2deg); }
      }

      @media (max-width: 768px) {
        body {
          background-size: 100vw auto;
          background-repeat: repeat-y;
          background-attachment: scroll;
          background-position: top center;
        }

        .app-container {
          max-width: 100%;
        }

        .topbar {
          padding-top: calc(var(--safe-top) + 8px);
          padding-bottom: 2px;
        }

        .topbar-inner {
          margin: 0 8px;
          padding: 8px 12px;
          gap: 8px;
        }

        .blog-brand {
          font-size: 1.15rem;
          padding: 4px 12px;
        }

        .topbar-icon {
          padding: 6px 8px;
          font-size: 1rem;
        }

        main {
          padding: 0 8px calc(80px + var(--safe-bottom));
          -webkit-mask-image: linear-gradient(to bottom, transparent, black 8px);
          mask-image: linear-gradient(to bottom, transparent, black 8px);
        }

        #postsContainer {
          padding-top: 4px;
        }

        #postsContainer::before {
          top: -8px;
          width: calc(100% - 16px);
          height: 22px;
        }

        #postsContainer .post:first-child::before {
          top: -14px;
          left: 12px;
          right: 12px;
          height: 14px;
          border-radius: 6px 6px 0 0;
        }

        .post {
          margin: 16px 0;
          padding: 16px;
          box-shadow: var(--shadow-hard);
        }

        .post.pinned {
          margin-top: 22px;
          padding-top: 20px;
        }

        .pin-badge-text {
          gap: 5px;
          padding: 3px 8px;

#postsContainer::before,
#postsContainer .post:first-child::before { display: none !important; }

  display: block;

  transform: none !important;

  return pinned.concat(rest);

      function escapeRegExp(s) {
        return s.replace(/[.*+?^${}()|\\[\]]/g, "\\$&");
      }
      function formatRelativeTime(dateStr) {
        const target = new Date(dateStr.replace(/-/g, "/"));
        if (isNaN(target.getTime())) return dateStr;
        const now = new Date(),
          diffMs = now - target;
        const diffMin = Math.floor(diffMs / 60000);
        const diffHour = Math.floor(diffMin / 60);
        const diffDay = Math.floor(diffHour / 24);
        if (diffDay < 3) {
          if (diffMin < 1) return "刚刚";
          if (diffMin < 60) return diffMin + "分钟前";
          if (diffHour < 24) return diffHour + "小时前";
        }
        const y = target.getFullYear();
        const m = String(target.getMonth() + 1).padStart(2, "0");
        const d = String(target.getDate()).padStart(2, "0");
        return y + "-" + m + "-" + d;
      }

      function parseMdToPosts(mdContent, fileYear) {
        const fi = mdContent.indexOf("---", 3);
        const raw = fi > -1 ? mdContent.slice(fi + 3).trim() : mdContent.trim();
        return raw
          .split(/\n\n+/)
          .filter((s) => s.trim())
          .map((item, idx) => {
            let text = item.trim();
            let date = "";
            let images = [];
            const imgR = /!\[.*?\]\((https?:\/\/.+?)\)/g;
            const imgM = [...text.matchAll(imgR)];
            if (imgM.length) {
              images = imgM.map((m) => m[1]);
              text = text.replace(imgR, "");
            }
            const dm = text.match(/@(\d{4}-\d{2}-\d{2}\s+\d{2}(?::|::)\d{2})/);
            if (dm) {
              date = dm[1].replace(/::/g, ":");
              text = text.replace(dm[0], "").trim();
            } else {
              date = fileYear + "-01-01 00:00";
            }
            if (text || images.length) {
              return {
                id:
                  fileYear +
                  "_" +
                  idx +
                  "_" +
                  Math.random().toString(36).slice(2, 5),
                date,
                content: [text],
                images,
              };
            }
            return null;
          })
          .filter(Boolean);
      }

      // ---------- 数据加载 ----------
      async function init() {
        if (isLoading) return;
        isLoading = true;
        loaderDom.style.display = "block";
        loaderDom.textContent = "正在加载手账...";
        const isLocalPreview = ["file:", "about:"].includes(location.protocol) || /localhost|127\.0\.0\.1/.test(location.hostname);
        try {
          if (isLocalPreview) {
            allPosts = getMockPosts();
          } else {
            const res = await fetch(`${WORKER_URL}/api/get-memos`, {
              method: "POST",
              headers: {
                "Content-Type": "application/json"
              }
            });
            if (!res.ok) throw new Error("网络响应错误");
            const json = await res.json();
            if (json.code === 200) {
              allPosts = json.data || [];
              if (!allPosts.length) allPosts = getMockPosts();
            } else {
              throw new Error(json.msg || "获取数据失败");
            }
          }
        } catch (err) {
          console.error(err);
          allPosts = getMockPosts();
          showToast("在线数据不可用，已切换为本地演示数据", "error");
        }

        filtered = [...allPosts];
        page = 1;
        loaderDom.style.display = "none";
        isLoading = false;
        render(true);
        setupInfiniteScroll();
        setupLightbox();
      }

      function render(reset = false) {
        if (!postsContainer) return;
        if (reset) postsContainer.innerHTML = "";
         const ordered = getPinnedView(filtered);   // 👈 新增这一行
        const start = reset ? 0 : (page - 1) * perPage;
        const end = page * perPage;
       const show = ordered.slice(start, end); 
        if (!show.length && reset) {
          postsContainer.innerHTML =
            '<div style="text-align:center;color:var(--secondary-text);padding:40px;font-weight:900;">暂无数据</div>';
          return;
        }
        const html = show.map(buildPostHTML).join("");
        if (reset) postsContainer.innerHTML = html;
        else {
          const t = document.createElement("div");
          t.innerHTML = html;
          while (t.firstChild) postsContainer.appendChild(t.firstChild);
        }
        bindImagesInContainer(postsContainer);
        if (window.__scrapbookPreview) window.__scrapbookPreview.bindScrapbookPreviewClicks(postsContainer);
      }

      function setupInfiniteScroll() {
        const scrollContainer = document.querySelector("main"); // 把滚动监听绑定给 main
        if (!scrollContainer) return;
        let noMoreShown = false;
        let hideTimer = null;
        const handleScroll = () => {
          if (isLoading) return;
          const { scrollTop, clientHeight, scrollHeight } = scrollContainer;
          const nearBottom = scrollTop + clientHeight >= scrollHeight - 150;
          if (!nearBottom) {
            noMoreShown = false;
            return;
          }
          if (page * perPage < filtered.length) {
            noMoreShown = false;
            page++;
            if (loaderDom) loaderDom.style.display = "block";
            render(false);
            if (loaderDom) loaderDom.style.display = "none";
          } else if (loaderDom && filtered.length && !noMoreShown) {
            noMoreShown = true;
            loaderDom.style.display = "block";
            loaderDom.textContent = "已经没有更多手账了";
            clearTimeout(hideTimer);
            hideTimer = setTimeout(() => {
              if (loaderDom) loaderDom.style.display = "none";
            }, 800);
          }
        };
        scrollContainer.addEventListener("scroll", handleScroll, { passive: true });
      }

        container.querySelectorAll(".post-images").forEach((wrap) => {

      function setPublishPassword(p) {
        /* 简写保留完整 */ const e = new Date(
          Date.now() + PUBLISH_PWD_DAYS * 86400000,
        ).toUTCString();
        document.cookie = `${PUBLISH_PWD_KEY}=${encodeURIComponent(p)}; expires=${e}; path=/; SameSite=Lax`;
      }
      function getPublishPassword() {
        const m = document.cookie.match(
          new RegExp(`(?:^|; )${PUBLISH_PWD_KEY}=([^;]*)`),
        );
        return m ? decodeURIComponent(m[1]) : "";
      }
      function clearPublishPassword() {
        document.cookie = `${PUBLISH_PWD_KEY}=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/; SameSite=Lax`;
      }

        return `${d.getUTCFullYear()}-${p(d.getUTCMonth() + 1)}-${p(d.getUTCDate())} ${p(d.getUTCHours())}:${p(d.getUTCMinutes())}`;

      function renderSelectedImages() {
        const wrap = document.getElementById("previewWrap"),
          ct = document.getElementById("imgCountText");
        if (!wrap || !ct) return;
        ct.textContent = selectedPublishFiles.length
          ? `已选择${selectedPublishFiles.length}张图片`
          : "未选择图片";
        if (!selectedPublishFiles.length) {
          wrap.innerHTML =
            '<div class="publish-empty">支持多张，可拖动缩略图调整顺序。</div>';
          return;
        }
        wrap.innerHTML = `<div class="preview-grid">${selectedPublishFiles.map((i, idx) => `<div class="preview-item" draggable="true" data-idx="${idx}"><img src="${i.previewUrl}" draggable="false"/><button class="preview-del" data-idx="${idx}">✕</button></div>`).join("")}</div>`;
        wrap.querySelectorAll(".preview-item").forEach((item) => {
          const idx = Number(item.dataset.idx);
          item.addEventListener("dragstart", (e) => {
            publishPreviewDragIndex = idx;
            item.classList.add("dragging");
            e.dataTransfer.effectAllowed = "move";
            e.dataTransfer.setData("text/plain", String(idx));
            e.dataTransfer.setData(PUBLISH_PREVIEW_DRAG_TYPE, String(idx));
          });
          item.addEventListener("dragend", () => {
            publishPreviewDragIndex = null;
            item.classList.remove("dragging");
            document
              .getElementById("publishDropZone")
              ?.classList.remove("drag-over");
            wrap
              .querySelectorAll(".drag-target")
              .forEach((el) => el.classList.remove("drag-target"));
          });
          item.addEventListener("dragover", (e) => {
            e.preventDefault();
            item.classList.add("drag-target");
          });
          item.addEventListener("dragleave", () =>
            item.classList.remove("drag-target"),
          );
          item.addEventListener("drop", (e) => {
            e.preventDefault();
            e.stopPropagation();
            item.classList.remove("drag-target");
            document
              .getElementById("publishDropZone")
              ?.classList.remove("drag-over");
            const fromText = e.dataTransfer.getData(
              PUBLISH_PREVIEW_DRAG_TYPE,
            );
            const from =
              publishPreviewDragIndex ??
              (fromText === "" ? NaN : Number(fromText));
            const to = idx;
            if (
              !Number.isInteger(from) ||
              from === to ||
              from < 0 ||
              from >= selectedPublishFiles.length
            ) {
              addSelectedPublishFiles(e.dataTransfer.files);
              return;
            }
            const [moved] = selectedPublishFiles.splice(from, 1);
            selectedPublishFiles.splice(to, 0, moved);
            renderSelectedImages();
          });
        });
        wrap.querySelectorAll(".preview-del").forEach((btn) => {
          btn.onclick = () => {
            const i = Number(btn.dataset.idx);
            URL.revokeObjectURL(selectedPublishFiles[i].previewUrl);
            selectedPublishFiles.splice(i, 1);
            renderSelectedImages();
          };
        });
      }
            async function submitMemo() {

          }

          const res = await fetch(WORKER_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              publishPassword: pwd,
              content,
              newImgList,
            }),
          });

          showToast("网络错误，发布失败", "error");

        const handleScroll = () => {
          if (scrollContainer.scrollTop > 300) {
            backBtn.classList.add("visible");
          } else {
            backBtn.classList.remove("visible");
          }
        };
        scrollContainer.addEventListener("scroll", handleScroll, {
          passive: true,
        });
        backBtn.addEventListener("click", () => {
          scrollContainer.scrollTo({ top: 0, behavior: "smooth" });
        });
        handleScroll(); // 初始检测一次
      }

      
      const menuHomeBtn = document.getElementById("homeNavBtn");
      if (menuHomeBtn) {
        menuHomeBtn.onclick = (e) => {
          e.preventDefault();
          const scrollContainer = document.querySelector("main");
          if (scrollContainer) scrollContainer.scrollTo({ top: 0, behavior: "smooth" });
        };
      }
      const menuButtons = document.querySelectorAll('.menu .menu-item');
      const setActiveMenu = (id) => {
        menuButtons.forEach(btn => btn.classList.toggle('active', btn.id === id));
        if (id === 'homeNavBtn' && menuHomeBtn) menuHomeBtn.classList.add('active');
      };
      document.getElementById("openSearchBtn")?.addEventListener('click', () => setActiveMenu('openSearchBtn'));
      document.getElementById("themeToggleBtn")?.addEventListener('click', () => setActiveMenu('themeToggleBtn'));
      document.getElementById("openPublishBtn")?.addEventListener('click', () => setActiveMenu('openPublishBtn'));

      document.addEventListener("DOMContentLoaded", () => {
        init();
        initBackToTop();
      });
    </script>
  
<script>
  window.__scrapbookPreview = (function () {
    function buildScrapbookPreview(item) {
      const images = Array.isArray(item && item.images) ? item.images.filter(Boolean) : [];
      if (!images.length) return '';
      const seed = Math.random() > 0.5 ? 'single-a' : 'single-b';
      const variant = Math.random() > 0.5 ? 'variant-a' : 'variant-b';
      if (images.length === 1) {
        return `<div class="scrapbook-stack" data-preview-count="1"><div class="scrapbook-photo ${seed} clip" data-preview-index="0"><img src="${images[0]}" alt=""></div></div>`;
      }
      const extra = images.length - 2;
      return `<div class="scrapbook-stack" data-preview-count="${images.length}">
        <div class="scrapbook-photo ${variant} first" data-preview-index="0"><img src="${images[0]}" alt=""></div>
        <div class="scrapbook-photo ${variant} second ${extra > 0 ? 'plus' : ''}" ${extra > 0 ? `data-plus="+${extra}"` : ''} data-preview-index="1"><img src="${images[1]}" alt=""></div>
      </div>`;
    }

    function bindScrapbookPreviewClicks(root) {
      (root || document).querySelectorAll('.scrapbook-preview-host').forEach((host) => {
        if (host.dataset.boundPreviewClick) return;
        host.dataset.boundPreviewClick = '1';
        host.addEventListener('click', (e) => {
          const clicked = e.target.closest('.scrapbook-photo');
          if (!clicked) return;
          const card = host.closest('.post, article');
          const imgs = [...(card ? card.querySelectorAll('.scrapbook-gallery-source img') : [])];
          if (!imgs.length) return;
          const index = Number(clicked.dataset.previewIndex || 0);
          currentGallery = imgs.map(i => i.src);
currentIndex = index;
if (typeof openLightbox === 'function') openLightbox();
        });
      });
    }

    return { buildScrapbookPreview, bindScrapbookPreviewClicks };
  })();
</script>
